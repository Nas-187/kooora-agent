<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النادي | كورة ايجنت</title>
<meta name="description" content="إحصائيات وتشكيلة ونتائج نادي كرة قدم من دوري روشن السعودي أو الدوريات الأوروبية الخمس الكبرى.">
<meta property="og:title" content="النادي | كورة ايجنت">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0F3D2E;
    --pitch-dark:#0A2B20;
    --cream:#F6F3EC;
    --gold:#C9973F;
    --ink:#1A1F1C;
    --ink-soft:#565f59;
    --line-red:#C0392B;
    --card:#FFFFFF;
    --line:#E4DFD2;
  }
  :root[data-theme="dark"]{
    --cream:#121712;
    --card:#1c241d;
    --ink:#EFEFEA;
    --ink-soft:#9AA39A;
    --line:#2b352c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'Tajawal', sans-serif; line-height:1.5; overflow-x:hidden; }
  h1,h2,h3,.num,.brand{ font-family:'Cairo', sans-serif; }

  header{
    background:var(--pitch);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 0, transparent 45%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 68px);
    color:var(--cream); padding:22px 6vw 30px;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; gap:14px; }
  .brand{ font-size:26px; font-weight:900; color:var(--cream); display:flex; align-items:center; gap:10px; }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--gold); }
  nav{ display:flex; align-items:center; gap:28px; font-size:15px; font-weight:700; flex-wrap:wrap; }
  nav a{ color:rgba(246,243,236,0.75); text-decoration:none; }
  nav a.active{ color:var(--gold); }
  .theme-toggle{
    width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06); color:var(--cream); cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .theme-toggle:hover{ border-color:var(--gold); }

  .club-header{ display:flex; align-items:center; gap:18px; }
  .club-header .crest{ width:64px; height:64px; border-radius:50%; overflow:hidden; background:rgba(255,255,255,0.08); flex-shrink:0; }
  .club-header .crest img{ width:100%; height:100%; object-fit:contain; padding:6px; }
  .club-header h1{ font-size:clamp(24px, 3.4vw, 34px); font-weight:800; color:var(--cream); }
  .club-header .league-name{ font-size:13px; font-weight:700; color:var(--gold); margin-top:4px; }

  main{ max-width:820px; margin:0 auto; padding:36px 6vw 60px; }

  .stats-row{ display:flex; gap:12px; margin-bottom:28px; flex-wrap:wrap; }
  .stat-card{
    flex:1; min-width:100px; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px; text-align:center;
  }
  .stat-card .value{ font-family:'Cairo'; font-size:26px; font-weight:900; color:var(--pitch); }
  .stat-card .label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-top:4px; }

  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; padding-bottom:10px; border-bottom:2px solid var(--pitch);
  }
  .section-head h2{ font-size:20px; font-weight:800; }

  .result-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; margin-bottom:12px; display:grid;
    grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;
  }
  .result-team{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:14px; }
  .result-team.away{ flex-direction:row-reverse; text-align:left; }
  .result-crest{ width:30px; height:30px; border-radius:50%; overflow:hidden; background:var(--pitch); flex-shrink:0; }
  .result-crest img{ width:100%; height:100%; object-fit:contain; padding:3px; }
  .result-score{ font-family:'Cairo'; font-size:22px; font-weight:900; text-align:center; min-width:70px; }
  .result-meta{ grid-column:1/-1; font-size:11px; color:var(--ink-soft); font-weight:700; text-align:center; margin-top:6px; }
  .result-card.win{ border-right:4px solid var(--pitch); }
  .result-card.loss{ border-right:4px solid var(--line-red); }
  .result-card.draw{ border-right:4px solid var(--gold); }

  .squad-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:14px; margin-bottom:36px; }
  .player-card{
    background:linear-gradient(160deg, var(--pitch) 0%, var(--pitch-dark) 100%);
    border-radius:14px; overflow:hidden; position:relative; text-align:center;
    box-shadow:0 4px 10px rgba(26,31,28,0.1); transition:transform .15s, box-shadow .15s;
  }
  .player-card:hover{ transform:translateY(-4px) scale(1.02); box-shadow:0 12px 22px rgba(26,31,28,0.18); }
  .player-card .number{
    position:absolute; top:8px; right:10px; font-family:'Cairo'; font-weight:900;
    font-size:20px; color:var(--gold); opacity:.9;
  }
  .player-card .photo-wrap{ height:110px; display:flex; align-items:flex-end; justify-content:center; overflow:hidden; }
  .player-card .photo-wrap img{ height:120px; object-fit:cover; object-position:top; filter:drop-shadow(0 4px 6px rgba(0,0,0,.3)); }
  .player-card .info{ background:var(--cream); padding:10px 6px 12px; }
  .player-card .p-name{ font-size:12.5px; font-weight:800; color:var(--ink); line-height:1.3; min-height:32px; }
  .player-card .p-position{
    display:inline-block; margin-top:6px; font-size:9.5px; font-weight:800; color:var(--pitch);
    background:rgba(15,61,46,0.1); padding:3px 10px; border-radius:100px;
  }

  .empty-state{
    padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:14px;
    background:var(--card); border:1px dashed var(--line); border-radius:10px;
  }

  .player-card{ cursor:pointer; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,15,12,0.55); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--card); border-radius:16px; max-width:420px; width:100%;
    max-height:88vh; overflow-y:auto; position:relative; box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .modal-close{
    position:absolute; top:12px; left:12px; width:32px; height:32px; border-radius:50%;
    border:none; background:rgba(0,0,0,0.35); color:#fff; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; z-index:2;
  }
  .modal-photo-wrap{
    background:linear-gradient(160deg, var(--pitch) 0%, var(--pitch-dark) 100%);
    height:180px; display:flex; align-items:flex-end; justify-content:center; overflow:hidden;
  }
  .modal-photo-wrap img{ height:190px; object-fit:cover; object-position:top; }
  .modal-body{ padding:20px 22px 26px; }
  .modal-name{ font-size:20px; font-weight:800; margin-bottom:2px; }
  .modal-position{
    display:inline-block; margin-bottom:14px; font-size:11px; font-weight:800; color:var(--pitch);
    background:rgba(15,61,46,0.1); padding:3px 10px; border-radius:100px;
  }
  .modal-facts{
    display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-bottom:16px;
    padding-bottom:16px; border-bottom:1px solid var(--line);
  }
  .modal-fact .flabel{ font-size:10.5px; color:var(--ink-soft); font-weight:700; }
  .modal-fact .fvalue{ font-size:13px; font-weight:800; }
  .modal-bio{ font-size:13.5px; line-height:1.8; color:var(--ink); margin-bottom:16px; }
  .modal-tm-link{
    display:inline-block; font-size:12.5px; font-weight:800; color:var(--pitch);
    text-decoration:none; border:1px solid var(--pitch); border-radius:8px; padding:8px 14px;
  }
  .modal-tm-link:hover{ background:var(--pitch); color:var(--cream); }

  footer{
    background:var(--pitch-dark); color:rgba(246,243,236,0.55);
    text-align:center; padding:26px; font-size:13px; margin-top:40px;
  }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> كورة ايجنت</div>
    <nav>
      <a href="index.html">مباريات اليوم</a>
      <a href="news.html">الأخبار</a>
      <a href="standings.html">الترتيب</a>
      <a href="clubs.html" class="active">الأندية</a>
      <a href="leagues.html">الدوريات</a>
      <a href="future.html">قريباً</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="تبديل الوضع الليلي">🌙</button>
    </nav>
  </div>
  <div class="club-header" id="club-header">
    <div class="crest" id="club-crest"></div>
    <div>
      <h1 id="club-name">جاري التحميل...</h1>
      <div class="league-name" id="club-league"></div>
    </div>
  </div>
</header>

<main>
  <div class="stats-row" id="stats-row"></div>

  <div class="section-head">
    <h2>التشكيلة</h2>
  </div>
  <div class="squad-grid" id="squad-grid"></div>

  <div class="section-head">
    <h2>آخر النتائج</h2>
  </div>
  <div id="results-list"></div>
</main>

<footer>&copy; كورة ايجنت 2026</footer>

<div class="modal-overlay" id="player-modal">
  <div class="modal-box" id="player-modal-box"></div>
</div>

<script>
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('theme', t); }catch(e){}
  document.getElementById('theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
}
document.getElementById('theme-toggle').textContent =
  document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
document.getElementById('theme-toggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});

const params = new URLSearchParams(location.search);
const clubId = params.get('id');

function resultClass(m){
  const isHome = m.home_id === clubId;
  const us = isHome ? m.home_goals : m.away_goals;
  const them = isHome ? m.away_goals : m.home_goals;
  if(us > them) return 'win';
  if(us < them) return 'loss';
  return 'draw';
}

fetch('results_archive.json?t=' + Date.now())
  .then(res => { if(!res.ok) throw 0; return res.json(); })
  .then(archive => {
    const matches = archive.filter(m => m.home_id === clubId || m.away_id === clubId)
                            .sort((a, b) => new Date(b.date) - new Date(a.date));

    if(matches.length === 0){
      document.getElementById('club-name').textContent = 'النادي غير موجود بالأرشيف';
      document.getElementById('results-list').innerHTML = '<div class="empty-state">ما فيه بيانات مؤرشفة لهذا النادي بعد</div>';
      return;
    }

    const first = matches[0];
    const isHome = first.home_id === clubId;
    const name = isHome ? first.home : first.away;
    const logo = isHome ? first.home_logo : first.away_logo;

    document.getElementById('club-name').textContent = name;
    document.getElementById('club-league').textContent = first.league_name || '';
    document.getElementById('club-crest').innerHTML = logo ? `<img src="${logo}" alt="${name}">` : '';
    document.title = name + ' | كورة ايجنت';

    let wins = 0, draws = 0, losses = 0, gf = 0, ga = 0;
    matches.forEach(m => {
      const h = m.home_id === clubId;
      const us = h ? m.home_goals : m.away_goals;
      const them = h ? m.away_goals : m.home_goals;
      gf += us; ga += them;
      if(us > them) wins++; else if(us < them) losses++; else draws++;
    });

    document.getElementById('stats-row').innerHTML = `
      <div class="stat-card"><div class="value">${matches.length}</div><div class="label">لعب</div></div>
      <div class="stat-card"><div class="value">${wins}</div><div class="label">فوز</div></div>
      <div class="stat-card"><div class="value">${draws}</div><div class="label">تعادل</div></div>
      <div class="stat-card"><div class="value">${losses}</div><div class="label">خسارة</div></div>
      <div class="stat-card"><div class="value">${gf}-${ga}</div><div class="label">الأهداف له/عليه</div></div>`;

    document.getElementById('results-list').innerHTML = matches.map(m => `
      <div class="result-card ${resultClass(m)}">
        <div class="result-team home">
          <span class="result-crest">${m.home_logo ? `<img src="${m.home_logo}">` : ''}</span>
          <span>${m.home}</span>
        </div>
        <div class="result-score">${m.home_goals} - ${m.away_goals}</div>
        <div class="result-team away">
          <span class="result-crest">${m.away_logo ? `<img src="${m.away_logo}">` : ''}</span>
          <span>${m.away}</span>
        </div>
        <div class="result-meta">${m.date} · ${m.league_name || ''}</div>
      </div>`).join('');
  })
  .catch(() => {
    document.getElementById('club-name').textContent = 'تعذّر تحميل البيانات';
  });

const POSITION_AR = {
  'Goalkeeper': 'حارس مرمى',
  'Defender': 'مدافع',
  'Midfielder': 'وسط',
  'Attacker': 'مهاجم',
};

let playersBio = {};

const FACT_LABELS = {
  nationality: 'الجنسية',
  birth_place: 'مكان الميلاد',
  birth_date: 'تاريخ الميلاد',
  age: 'العمر',
  height: 'الطول',
  weight: 'الوزن',
  joined: 'تاريخ الانضمام',
};

function openPlayerModal(p){
  const bioEntry = playersBio[String(p.id)];
  const facts = bioEntry ? bioEntry.facts : {};
  const bioText = bioEntry ? bioEntry.bio : 'قصة اللاعب غير متوفرة بعد.';

  const factsHtml = Object.entries(FACT_LABELS)
    .filter(([key]) => facts[key])
    .map(([key, label]) => `
      <div class="modal-fact">
        <div class="flabel">${label}</div>
        <div class="fvalue">${facts[key]}${key === 'age' && facts[key] ? ' عاماً' : ''}</div>
      </div>`).join('');

  document.getElementById('player-modal-box').innerHTML = `
    <button type="button" class="modal-close" id="modal-close-btn">✕</button>
    <div class="modal-photo-wrap">${p.photo ? `<img src="${p.photo}" alt="${p.name}" onerror="this.remove()">` : ''}</div>
    <div class="modal-body">
      <div class="modal-name">${p.name}</div>
      <span class="modal-position">${POSITION_AR[p.position] || p.position || ''}</span>
      ${factsHtml ? `<div class="modal-facts">${factsHtml}</div>` : ''}
      <p class="modal-bio">${bioText}</p>
      ${facts.transfermarkt_url ? `<a class="modal-tm-link" href="${facts.transfermarkt_url}" target="_blank" rel="noopener">القيمة السوقية على Transfermarkt ↗</a>` : ''}
    </div>`;

  document.getElementById('player-modal').classList.add('open');
  document.getElementById('modal-close-btn').addEventListener('click', closePlayerModal);
}

function closePlayerModal(){
  document.getElementById('player-modal').classList.remove('open');
}

document.getElementById('player-modal').addEventListener('click', (e) => {
  if(e.target.id === 'player-modal') closePlayerModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closePlayerModal();
});

Promise.all([
  fetch('squads.json?t=' + Date.now()).then(res => { if(!res.ok) throw 0; return res.json(); }),
  fetch('players_bio.json?t=' + Date.now()).then(res => res.ok ? res.json() : {}).catch(() => ({})),
])
  .then(([squads, bios]) => {
    playersBio = bios;
    const players = squads[String(clubId)] || [];
    const grid = document.getElementById('squad-grid');

    if(players.length === 0){
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">التشكيلة غير متاحة حالياً</div>';
      return;
    }

    grid.innerHTML = players.map((p, i) => `
      <div class="player-card" data-index="${i}">
        <div class="number">${p.number ?? ''}</div>
        <div class="photo-wrap">${p.photo ? `<img src="${p.photo}" alt="${p.name}" loading="lazy" onerror="this.remove()">` : ''}</div>
        <div class="info">
          <div class="p-name">${p.name}</div>
          <span class="p-position">${POSITION_AR[p.position] || p.position || ''}</span>
        </div>
      </div>`).join('');

    grid.querySelectorAll('.player-card').forEach(card => {
      card.addEventListener('click', () => openPlayerModal(players[Number(card.dataset.index)]));
    });
  })
  .catch(() => {
    document.getElementById('squad-grid').innerHTML = '<div class="empty-state" style="grid-column:1/-1">تعذّر تحميل التشكيلة</div>';
  });
</script>

</body>
</html>
