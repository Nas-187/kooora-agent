<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كورة ايجنت | نتائج وأخبار كرة القدم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0F3D2E;
    --pitch-dark:#0A2B20;
    --cream:#F6F3EC;
    --gold:#C9973F;
    --ink:#1A1F1C;
    --ink-soft:#565f59;
    --line-red:#C0392B;
    --card:#FFFFFF;
    --line:#E4DFD2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    line-height:1.5;
  }
  h1,h2,h3,.num,.brand{ font-family:'Cairo', sans-serif; }

  /* ===== Header ===== */
  header{
    background:var(--pitch);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 0, transparent 45%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 68px);
    color:var(--cream);
    padding:22px 6vw 30px;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:26px;
  }
  .brand{
    font-size:26px; font-weight:900; color:var(--cream);
    display:flex; align-items:center; gap:10px;
  }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--gold); }
  nav{ display:flex; gap:28px; font-size:15px; font-weight:700; }
  nav a{ color:rgba(246,243,236,0.75); text-decoration:none; }
  nav a.active{ color:var(--gold); }

  .hero-line{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  .hero-line h1{
    font-size:clamp(28px, 4vw, 40px);
    font-weight:800;
  }
  .hero-line .date-tag{
    color:var(--gold); font-weight:700; font-size:15px;
    border:1px solid rgba(201,151,63,0.5); padding:4px 12px; border-radius:100px;
  }

  /* ===== Ticker ===== */
  .ticker-wrap{
    background:var(--pitch-dark); border-top:1px solid rgba(255,255,255,0.08);
    margin:22px -6vw 0; padding:0 6vw;
  }
  .ticker{
    display:flex; gap:0; overflow-x:auto; scrollbar-width:none;
  }
  .ticker::-webkit-scrollbar{ display:none; }
  .ticker-item{
    flex-shrink:0; display:flex; align-items:center; gap:9px;
    padding:13px 20px; border-left:1px solid rgba(255,255,255,0.08);
    font-size:12.5px; font-weight:700; color:rgba(246,243,236,0.85); white-space:nowrap;
  }
  .ticker-item .t-crest{ width:18px; height:18px; border-radius:50%; overflow:hidden; flex-shrink:0; background:rgba(255,255,255,0.1); }
  .ticker-item .t-crest img{ width:100%; height:100%; object-fit:contain; }
  .ticker-item .t-score{ color:var(--gold); font-family:'Cairo'; font-weight:900; }
  .ticker-item.live .t-score{ color:#e8664f; }

  /* ===== Layout ===== */
  main{
    max-width:1180px; margin:0 auto; padding:0 6vw 60px;
    display:grid; grid-template-columns: 1fr 340px; gap:40px;
  }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } }

  section{ margin-top:44px; }
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; padding-bottom:10px; border-bottom:2px solid var(--pitch);
  }
  .section-head h2{ font-size:20px; font-weight:800; }
  .section-head .league-badge{
    font-size:12px; font-weight:700; color:var(--pitch); background:rgba(15,61,46,0.08);
    padding:5px 12px; border-radius:100px;
  }

  /* ===== Hero story (featured match) ===== */
  .hero-story{
    position:relative; border-radius:16px; overflow:hidden; min-height:280px;
    background:linear-gradient(135deg, var(--pitch) 0%, var(--pitch-dark) 100%);
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:28px 30px; margin-bottom:22px; isolation:isolate;
  }
  .hero-story::before{
    content:''; position:absolute; inset:0; z-index:-1;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 70px);
  }
  .hero-story::after{
    content:''; position:absolute; inset:0; z-index:-1;
    background:linear-gradient(0deg, rgba(10,20,15,0.92) 5%, rgba(10,20,15,0.25) 60%, transparent 100%);
  }
  .hero-crests{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:-2;
    display:flex; align-items:center; gap:6vw; opacity:0.16; filter:grayscale(1) brightness(3);
  }
  .hero-crests img{ width:min(22vw,220px); height:min(22vw,220px); object-fit:contain; }
  .hero-meta{
    display:flex; align-items:center; gap:10px; margin-bottom:12px;
  }
  .hero-tag{
    font-size:11.5px; font-weight:800; color:var(--pitch-dark); background:var(--gold);
    padding:5px 13px; border-radius:100px; letter-spacing:.3px;
  }
  .hero-live{
    font-size:11.5px; font-weight:800; color:#fff; background:var(--line-red);
    padding:5px 13px; border-radius:100px; display:flex; align-items:center; gap:5px;
  }
  .hero-score{
    color:var(--cream); font-family:'Cairo'; font-weight:900;
    font-size:clamp(30px,4.4vw,46px); letter-spacing:1px; margin-bottom:6px;
  }
  .hero-score .vs{ font-size:.5em; color:var(--gold); font-weight:700; margin:0 10px; }
  .hero-title{
    color:var(--cream); font-size:clamp(18px,2.3vw,26px); font-weight:800; line-height:1.4;
    max-width:640px;
  }
  .hero-story .article-preview{
    color:rgba(246,243,236,0.7); margin-top:12px; max-width:640px;
    border-top:1px solid rgba(255,255,255,0.12); padding-top:12px;
  }

  /* ===== Match Card (story grid) ===== */
  .story-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .story-grid{ grid-template-columns:1fr; } }

  .match-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:0;
    display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:14px;
    position:relative; overflow:hidden;
    box-shadow:0 1px 2px rgba(26,31,28,0.04);
    transition:box-shadow .15s, transform .15s;
  }
  .match-card:hover{ box-shadow:0 10px 24px rgba(26,31,28,0.1); transform:translateY(-2px); }
  .match-card::before{
    content:''; position:absolute; top:0; right:0; bottom:0; width:4px; background:var(--pitch);
  }
  .match-card.live::before{ background:var(--line-red); }
  .match-card .league-tag{
    grid-column:1/-1; font-size:10.5px; font-weight:800; color:var(--gold);
    text-transform:uppercase; letter-spacing:.4px; margin-bottom:-4px;
  }
  .team{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:14.5px; }
  .team.away{ flex-direction:row-reverse; text-align:left; justify-content:flex-start; }
  .crest{
    width:36px; height:36px; border-radius:50%;
    background:var(--pitch); color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    font-family:'Cairo'; font-weight:800; font-size:13px; flex-shrink:0;
    overflow:hidden; box-shadow:0 0 0 3px var(--cream), 0 0 0 4px var(--line);
  }
  .crest img{ width:100%; height:100%; object-fit:contain; padding:3px; }
  .score-block{ text-align:center; min-width:96px; }
  .score-block .num{ font-family:'Cairo'; font-size:26px; font-weight:900; letter-spacing:2px; }
  .score-block .status{
    font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-top:2px;
  }
  .match-card.live .status{ color:var(--line-red); }
  .status .live-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--line-red); margin-left:5px; animation:pulse 1.4s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  .article-preview{
    grid-column:1/-1; margin-top:10px; padding-top:12px; border-top:1px dashed var(--line);
    font-size:13.5px; color:var(--ink-soft); line-height:1.7;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }

  /* ===== Sidebar ===== */
  .sidebar-card{
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px;
  }
  .news-item{
    display:block; padding:14px 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit;
  }
  .news-item:last-child{ border-bottom:none; }
  .news-item .tag{
    font-size:11px; font-weight:700; color:var(--gold); margin-bottom:4px; display:block;
  }
  .news-item .title{ font-size:14.5px; font-weight:700; line-height:1.5; }

  .league-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .league-tab{
    font-size:11.5px; font-weight:700; padding:6px 10px; border-radius:20px;
    border:1px solid var(--line); background:var(--cream); color:var(--ink-soft);
    cursor:pointer; transition:.15s;
  }
  .league-tab:hover{ border-color:var(--gold); }
  .league-tab.active{ background:var(--pitch); color:#fff; border-color:var(--pitch); }

  .standings-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .standings-table th{
    text-align:right; font-weight:700; color:var(--ink-soft); font-size:11px;
    padding-bottom:10px; border-bottom:2px solid var(--pitch);
  }
  .standings-table td{ padding:9px 0; border-bottom:1px solid var(--line); font-weight:600; }
  .standings-table td.rank{ color:var(--gold); font-weight:800; width:24px; }
  .standings-table td.pts{ font-weight:800; text-align:center; }

  .empty-state{
    padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:14px;
    background:var(--card); border:1px dashed var(--line); border-radius:10px;
  }

  footer{
    background:var(--pitch-dark); color:rgba(246,243,236,0.55);
    text-align:center; padding:26px; font-size:13px; margin-top:40px;
  }
  footer strong{ color:var(--gold); }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> كورة ايجنت</div>
    <nav>
      <a href="index.html" class="active">مباريات اليوم</a>
      <a href="news.html">الأخبار</a>
      <a href="standings.html">الترتيب</a>
      <a href="#">الدوريات</a>
    </nav>
  </div>
  <div class="hero-line">
    <h1>نتائج وأخبار اليوم</h1>
    <span class="date-tag" id="today-date">—</span>
  </div>
</header>

<div class="ticker-wrap"><div class="ticker" id="ticker"></div></div>

<main>
  <div>
    <section id="matches-section" style="margin-top:30px">
      <div id="hero-story-slot"></div>

      <div class="section-head">
        <h2>مباريات اليوم</h2>
        <span class="league-badge" id="match-count">0 مباراة</span>
      </div>
      <div id="matches-list" class="story-grid"></div>
    </section>
  </div>

  <aside>
    <section style="margin-top:0">
      <div class="section-head">
        <h2>جدول الترتيب</h2>
      </div>
      <div class="sidebar-card">
        <div class="league-tabs" id="league-tabs"></div>
        <table class="standings-table">
          <thead><tr><th></th><th>الفريق</th><th>لعب</th><th>نقاط</th></tr></thead>
          <tbody id="standings-body">
            <tr><td class="rank">1</td><td>الهلال</td><td>4</td><td class="pts">12</td></tr>
            <tr><td class="rank">2</td><td>النصر</td><td>4</td><td class="pts">12</td></tr>
            <tr><td class="rank">3</td><td>الدرعية</td><td>4</td><td class="pts">7</td></tr>
            <tr><td class="rank">4</td><td>الأهلي</td><td>4</td><td class="pts">6</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>آخر الأخبار</h2>
      </div>
      <div class="sidebar-card" id="news-list" style="padding:6px 20px;"></div>
    </section>
  </aside>
</main>

<footer>
  &copy; كورة ايجنت 2026
</footer>

<script>
/* ============================================================
   بيانات تجريبية — بنفس الشكل اللي يطلعه football_agent_gemini.py
   لاحقاً: استبدل هذا المصفوفة بقراءة فعلية من matches_ready_to_publish.json
   عبر سيرفر بسيط (fetch)، بدل التعبئة اليدوية هنا.
============================================================ */
const sampleMatches = [
  {
    title: "LDU de Quito 2 - 1 Mushuc Runa SC",
    home_team: "LDU de Quito", away_team: "Mushuc Runa SC",
    home_score: 2, away_score: 1,
    league: "الدوري الإكوادوري", status: "Match Finished",
    content: "حسم فريق إل دي يو دي كيتو مواجهته أمام موتشوك رونا بنتيجة 2-1 في مباراة شهدت أداءً هجومياً لافتاً من الفريق المضيف، ليواصل مطاردة صدارة الترتيب."
  },
  {
    title: "Atlético-MG 1 - 1 Cruzeiro",
    home_team: "Atlético-MG", away_team: "Cruzeiro",
    home_score: 1, away_score: 1,
    league: "الدوري البرازيلي", status: "In Play",
    content: "تعادل أتلتيكو مينيرو وكروزيرو بهدف لكل فريق في ديربي ولاية ميناس جيرايس المثير، وسط أجواء حماسية من جماهير الفريقين."
  },
  {
    title: "Fortaleza FC 0 - 0 Once Caldas",
    home_team: "Fortaleza FC", away_team: "Once Caldas",
    home_score: 0, away_score: 0,
    league: "كأس سود أمريكانا", status: "Match Finished",
    content: "انتهت المباراة بالتعادل السلبي بين فورتاليزا وأونسي كالداس، في لقاء اتسم بالحذر التكتيكي من الجانبين ضمن مواجهات كأس سود أمريكانا."
  }
];

const sampleNews = [
  { tag:"الميركاتو", title:"الهلال يقترب من حسم صفقة جناح برازيلي جديد قبل إغلاق السوق" },
  { tag:"دوري روشن", title:"موعد قمة الهلال والأهلي يتحدد رسمياً في الجولة القادمة" },
  { tag:"أوروبا", title:"برشلونة يعلن التعاقد مع لاعب جديد لتعزيز خط الوسط" },
];

function initials(name){
  return name.trim().split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function crest(name, logoUrl){
  if(logoUrl){
    return `<img src="${logoUrl}" alt="${name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'), {textContent:'${initials(name)}'}))">`;
  }
  return initials(name);
}

function statusLabelFor(m){
  const isLive = m.status === 'In Play' || m.status === 'Halftime';
  return isLive
    ? '<span class="live-dot"></span> مباشر الآن'
    : (m.status === 'Match Finished' ? 'انتهت المباراة' : m.status);
}

function renderHeroStory(m){
  const slot = document.getElementById('hero-story-slot');
  if(!m){ slot.innerHTML = ''; return; }
  const isLive = m.status === 'In Play' || m.status === 'Halftime';

  slot.innerHTML = `
    <div class="hero-story">
      <div class="hero-crests">
        ${m.home_logo ? `<img src="${m.home_logo}">` : ''}
        ${m.away_logo ? `<img src="${m.away_logo}">` : ''}
      </div>
      <div class="hero-meta">
        <span class="hero-tag">${m.league}</span>
        ${isLive ? '<span class="hero-live"><span class="live-dot"></span> مباشر</span>' : ''}
      </div>
      <div class="hero-score">${m.home_score} <span class="vs">-</span> ${m.away_score}</div>
      <div class="hero-title">${m.home_team} ${isLive ? 'يواجه' : 'أمام'} ${m.away_team}</div>
      <div class="article-preview">${m.content}</div>
    </div>`;
}

function renderMatches(matches){
  const list = document.getElementById('matches-list');
  const count = document.getElementById('match-count');
  count.textContent = matches.length + ' مباراة';

  if(matches.length === 0){
    renderHeroStory(null);
    list.innerHTML = '<div class="empty-state">ما فيه مباريات مجهزة حالياً — شغّل السكربت وحدّث الصفحة</div>';
    return;
  }

  renderHeroStory(matches[0]);

  list.innerHTML = matches.slice(1).map(m => {
    const isLive = m.status === 'In Play' || m.status === 'Halftime';
    return `
    <div class="match-card ${isLive ? 'live' : ''}">
      <div class="league-tag">${m.league}</div>
      <div class="team home">
        <div class="crest">${crest(m.home_team, m.home_logo)}</div>
        <span>${m.home_team}</span>
      </div>
      <div class="score-block">
        <div class="num">${m.home_score} - ${m.away_score}</div>
        <div class="status">${statusLabelFor(m)}</div>
      </div>
      <div class="team away">
        <div class="crest">${crest(m.away_team, m.away_logo)}</div>
        <span>${m.away_team}</span>
      </div>
      <div class="article-preview">${m.content}</div>
    </div>`;
  }).join('');
}

function renderTicker(matches){
  const el = document.getElementById('ticker');
  if(!matches || matches.length === 0){ el.innerHTML = ''; return; }

  el.innerHTML = matches.map(m => {
    const isLive = m.status === 'In Play' || m.status === 'Halftime';
    return `
    <div class="ticker-item ${isLive ? 'live' : ''}">
      <span class="t-crest">${m.home_logo ? `<img src="${m.home_logo}">` : ''}</span>
      <span>${m.home_team}</span>
      <span class="t-score">${m.home_score}-${m.away_score}</span>
      <span>${m.away_team}</span>
      <span class="t-crest">${m.away_logo ? `<img src="${m.away_logo}">` : ''}</span>
    </div>`;
  }).join('');
}

function renderNews(news){
  document.getElementById('news-list').innerHTML = news.map(n => `
    <a class="news-item" href="#">
      <span class="tag">${n.tag}</span>
      <span class="title">${n.title}</span>
    </a>`).join('');
}

function renderDate(){
  const d = new Date();
  document.getElementById('today-date').textContent =
    d.toLocaleDateString('ar-SA', { weekday:'long', day:'numeric', month:'long' });
}

function renderStandings(standings){
  const tbody = document.getElementById('standings-body');
  if(!standings || standings.length === 0){
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:16px; color:var(--ink-soft);">جدول الترتيب غير متاح حالياً</td></tr>';
    return;
  }
  tbody.innerHTML = standings.slice(0, 8).map(s => `
    <tr>
      <td class="rank">${s.rank}</td>
      <td>${s.team}</td>
      <td>${s.played}</td>
      <td class="pts">${s.points}</td>
    </tr>`).join('');
}

let standingsByLeague = {};
let activeLeagueId = null;

function renderLeagueTabs(){
  const wrap = document.getElementById('league-tabs');
  const ids = Object.keys(standingsByLeague);
  wrap.innerHTML = ids.map(id => `
    <button type="button" class="league-tab ${id === activeLeagueId ? 'active' : ''}" data-league="${id}">
      ${standingsByLeague[id].name}
    </button>`).join('');

  wrap.querySelectorAll('.league-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeLeagueId = btn.dataset.league;
      renderLeagueTabs();
      renderStandings(standingsByLeague[activeLeagueId].standings);
    });
  });
}

function renderStandingsData(data){
  standingsByLeague = data || {};
  const ids = Object.keys(standingsByLeague);
  if(ids.length === 0) return;

  activeLeagueId = ids.includes('307') ? '307' : ids[0];
  renderLeagueTabs();
  renderStandings(standingsByLeague[activeLeagueId].standings);
}

renderDate();

// نجيب المباريات، الترتيب، والأخبار الحقيقية — ولو أي ملف ما لقيناه (أول تشغيل)
// نعرض بيانات تجريبية بدله بدل ما تطلع الصفحة فاضية
fetch('matches.json?t=' + Date.now())
  .then(res => { if(!res.ok) throw 0; return res.json(); })
  .then(data => { renderMatches(data); renderTicker(data); })
  .catch(() => { renderMatches(sampleMatches); renderTicker(sampleMatches); });

fetch('standings.json?t=' + Date.now())
  .then(res => { if(!res.ok) throw 0; return res.json(); })
  .then(data => renderStandingsData(data))
  .catch(() => {}); // الجدول الثابت بالـ HTML يبقى كما هو لو ما لقينا الملف

fetch('news.json?t=' + Date.now())
  .then(res => { if(!res.ok) throw 0; return res.json(); })
  .then(data => {
    const combined = [...(data.saudi || []), ...(data.europe || [])];
    renderNews(combined.length ? combined : sampleNews);
  })
  .catch(() => renderNews(sampleNews));
</script>

</body>
</html>
