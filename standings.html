<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الترتيب | كورة ايجنت</title>
<meta name="description" content="جدول ترتيب دوري روشن السعودي والدوريات الأوروبية الخمس الكبرى، محدّث تلقائياً ومحسوب من نتائج حقيقية.">
<meta property="og:title" content="الترتيب | كورة ايجنت">
<meta property="og:description" content="جدول ترتيب دوري روشن السعودي والدوريات الأوروبية الخمس الكبرى.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://charming-kringle-f53407.netlify.app/standings.html">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2747%27%20fill%3D%27%230F3D2E%27/%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2747%27%20fill%3D%27none%27%20stroke%3D%27%23C9973F%27%20stroke-width%3D%275%27/%3E%3Ctext%20x%3D%2750%27%20y%3D%2769%27%20font-family%3D%27Georgia%2C%20serif%27%20font-weight%3D%27700%27%20font-size%3D%2756%27%20fill%3D%27%23C9973F%27%20text-anchor%3D%27middle%27%3E%D9%83%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0F3D2E;
    --pitch-dark:#0A2B20;
    --cream:#F6F3EC;
    --gold:#C9973F;
    --ink:#1A1F1C;
    --ink-soft:#565f59;
    --line-red:#C0392B;
    --card:#FFFFFF;
    --line:#E4DFD2;
    --shadow-sm:0 1px 3px rgba(10,20,15,0.07), 0 1px 2px rgba(10,20,15,0.05);
    --shadow-md:0 6px 20px rgba(10,20,15,0.10), 0 2px 6px rgba(10,20,15,0.06);
    --shadow-lg:0 16px 40px rgba(10,20,15,0.16);
  }
  :root[data-theme="dark"]{
    --cream:#121712;
    --card:#1c241d;
    --ink:#EFEFEA;
    --ink-soft:#9AA39A;
    --line:#2b352c;
    --shadow-sm:0 1px 3px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.22);
    --shadow-md:0 6px 20px rgba(0,0,0,0.4);
    --shadow-lg:0 16px 40px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'Tajawal', sans-serif; line-height:1.5; overflow-x:hidden; }
  h1,h2,h3,.num,.brand{ font-family:'Changa', sans-serif; }
  .num, .score-block .num, .mr-badge, .rr-score, .tm-score, .article-score, .feed-score,
  .result-score, .hero-score, .ticker-item .t-score{ font-variant-numeric:tabular-nums; letter-spacing:.3px; }

  header{
    background:var(--pitch);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 0, transparent 45%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 68px);
    color:var(--cream); padding:22px 6vw 30px;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; gap:14px; }
  .brand{ font-size:26px; font-weight:900; color:var(--cream); display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    background:var(--pitch-dark); border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:'Changa'; font-weight:800; font-size:15px; color:var(--gold);
  }
  nav{ display:flex; align-items:center; gap:28px; font-size:15px; font-weight:700; flex-wrap:wrap; }
  nav a{ color:rgba(246,243,236,0.75); text-decoration:none; }
  nav a.active{ color:var(--gold); }
  .theme-toggle{
    width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06); color:var(--cream); cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .theme-toggle:hover{ border-color:var(--gold); }
  .hero-line{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .hero-line h1{ font-size:clamp(28px, 4vw, 40px); font-weight:800; }

  main{ max-width:760px; margin:0 auto; padding:36px 6vw 60px; }

  .league-tabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
  .league-tab{
    font-size:13px; font-weight:700; padding:9px 16px; border-radius:20px;
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    cursor:pointer; transition:.15s;
  }
  .league-tab:hover{ border-color:var(--gold); }
  .league-tab.active{ background:var(--pitch); color:#fff; border-color:var(--pitch); }

  .table-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:8px 24px; box-shadow:var(--shadow-sm);
  }
  .standings-table{ width:100%; border-collapse:collapse; font-size:14.5px; }
  .standings-table th{
    text-align:right; font-weight:700; color:var(--ink-soft); font-size:12px;
    padding:16px 6px 12px; border-bottom:2px solid var(--pitch);
  }
  .standings-table th.sortable{ cursor:pointer; user-select:none; transition:color .15s; }
  .standings-table th.sortable:hover{ color:var(--pitch); }
  .standings-table th.sortable.active{ color:var(--pitch); }
  .standings-table th .sort-arrow{ font-size:10px; margin-right:3px; opacity:.6; }
  .standings-table th.center, .standings-table td.center{ text-align:center; }
  .standings-table td{ padding:14px 6px; border-bottom:1px solid var(--line); font-weight:600; }
  .standings-table tr:last-child td{ border-bottom:none; }
  .standings-table td.rank{ color:var(--gold); font-weight:800; width:28px; font-family:'Changa'; }
  .standings-table td.pts{ font-weight:900; text-align:center; font-family:'Changa'; color:var(--pitch); }
  .standings-table .team-cell{ display:flex; align-items:center; gap:10px; }
  .team-crest{ width:26px; height:26px; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--pitch); }
  .team-crest img{ width:100%; height:100%; object-fit:contain; padding:2px; }

  .empty-state{
    padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:14px;
    background:var(--card); border:1px dashed var(--line); border-radius:10px;
  }

  footer{
    background:var(--pitch-dark); color:rgba(246,243,236,0.55);
    text-align:center; padding:26px; font-size:13px; margin-top:40px;
  }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand"><span class="mark">ك</span> كورة ايجنت</div>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="matches.html">مباريات اليوم</a>
      <a href="results.html">النتائج</a>
      <a href="news.html">الأخبار</a>
      <a href="standings.html" class="active">الترتيب</a>
      <a href="clubs.html">الأندية</a>
      <a href="leagues.html">الدوريات</a>
      <a href="future.html">قريباً</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="تبديل الوضع الليلي"></button>
    </nav>
  </div>
  <div class="hero-line"><h1>جدول الترتيب</h1></div>
</header>

<main>
  <div class="league-tabs" id="league-tabs"></div>
  <div class="table-card">
    <table class="standings-table">
      <thead>
        <tr>
          <th></th>
          <th class="sortable" data-sort="team">الفريق <span class="sort-arrow"></span></th>
          <th class="sortable center" data-sort="played">لعب <span class="sort-arrow"></span></th>
          <th class="sortable center active" data-sort="points">نقاط <span class="sort-arrow">▼</span></th>
        </tr>
      </thead>
      <tbody id="standings-body"></tbody>
    </table>
  </div>
</main>

<footer>&copy; كورة ايجنت 2026</footer>

<script>
const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
const MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('theme', t); }catch(e){}
  document.getElementById('theme-toggle').innerHTML = t === 'dark' ? SUN_ICON : MOON_ICON;
}
document.getElementById('theme-toggle').innerHTML =
  document.documentElement.getAttribute('data-theme') === 'dark' ? SUN_ICON : MOON_ICON;
document.getElementById('theme-toggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});

const urlLeague = new URLSearchParams(location.search).get('league');

function initials(name){
  return name.trim().split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function crest(name, logoUrl){
  if(logoUrl){
    return `<img src="${logoUrl}" alt="${name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'), {textContent:'${initials(name)}'}))">`;
  }
  return `<span style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#fff;font-size:10px;font-weight:800">${initials(name)}</span>`;
}

let currentStandings = [];
let sortField = 'points';
let sortDir = -1; // -1 تنازلي، 1 تصاعدي

function renderStandings(standings){
  currentStandings = standings || [];
  const tbody = document.getElementById('standings-body');
  if(currentStandings.length === 0){
    tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state">جدول الترتيب غير متاح حالياً</div></td></tr>';
    return;
  }

  const sorted = [...currentStandings].sort((a, b) => {
    const av = a[sortField], bv = b[sortField];
    if(typeof av === 'string') return sortDir * av.localeCompare(bv);
    return sortDir * (av - bv);
  });

  tbody.innerHTML = sorted.map(s => `
    <tr>
      <td class="rank">${s.rank}</td>
      <td>
        <div class="team-cell">
          <span class="team-crest">${crest(s.team, s.logo)}</span>
          <span>${s.team}</span>
        </div>
      </td>
      <td class="center">${s.played}</td>
      <td class="pts">${s.points}</td>
    </tr>`).join('');
}

document.querySelectorAll('.standings-table th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const field = th.dataset.sort;
    if(sortField === field){
      sortDir *= -1;
    }else{
      sortField = field;
      sortDir = field === 'team' ? 1 : -1;
    }
    document.querySelectorAll('.standings-table th.sortable').forEach(t => {
      t.classList.remove('active');
      t.querySelector('.sort-arrow').textContent = '';
    });
    th.classList.add('active');
    th.querySelector('.sort-arrow').textContent = sortDir === 1 ? '▲' : '▼';
    renderStandings(currentStandings);
  });
});

let standingsByLeague = {};
let activeLeagueId = null;

function renderLeagueTabs(){
  const wrap = document.getElementById('league-tabs');
  const ids = Object.keys(standingsByLeague);
  wrap.innerHTML = ids.map(id => `
    <button type="button" class="league-tab ${id === activeLeagueId ? 'active' : ''}" data-league="${id}">
      ${standingsByLeague[id].name}
    </button>`).join('');

  wrap.querySelectorAll('.league-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeLeagueId = btn.dataset.league;
      renderLeagueTabs();
      renderStandings(standingsByLeague[activeLeagueId].standings);
    });
  });
}

function renderStandingsData(data){
  standingsByLeague = data || {};
  const ids = Object.keys(standingsByLeague);
  if(ids.length === 0){
    document.getElementById('standings-body').innerHTML = '<tr><td colspan="4"><div class="empty-state">جدول الترتيب غير متاح حالياً</div></td></tr>';
    return;
  }
  activeLeagueId = (urlLeague && ids.includes(urlLeague)) ? urlLeague : (ids.includes('4668') ? '4668' : ids[0]);
  renderLeagueTabs();
  renderStandings(standingsByLeague[activeLeagueId].standings);
}

fetch('standings.json?t=' + Date.now())
  .then(res => { if(!res.ok) throw 0; return res.json(); })
  .then(data => renderStandingsData(data))
  .catch(() => renderStandingsData({}));
</script>

</body>
</html>
