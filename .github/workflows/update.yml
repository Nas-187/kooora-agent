name: تحديث نتائج المباريات

# يشتغل تلقائياً كل 30 دقيقة، وكمان تقدر تشغّله يدوياً من تبويب Actions
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# صلاحية الكتابة لازمة عشان يقدر يحفظ matches.json و standings.json و news.json بالمستودع
permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل نسخة من المستودع
        uses: actions/checkout@v4

      - name: تجهيز Node.js (مع تخزين مؤقت لـ netlify-cli)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: تثبيت netlify-cli من package-lock.json
        run: npm ci

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات المطلوبة
        run: pip install requests google-genai

      - name: تشغيل سكربت جلب المباريات
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python football_agent_gemini.py

      - name: حفظ ورفع matches.json و standings.json و news.json الجديدة
        run: |
          git config user.name "football-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add matches.json standings.json news.json results_archive.json squads.json
          git diff --staged --quiet || git commit -m "تحديث تلقائي لنتائج المباريات والترتيب والأخبار"
          git push

      - name: نشر الموقع على Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli deploy --prod --dir=.
