<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأخبار | كورة ايجنت</title>
<meta name="description" content="آخر أخبار الانتقالات والشائعات الحقيقية لدوري روشن السعودي والدوريات الأوروبية الخمس الكبرى.">
<meta property="og:title" content="الأخبار | كورة ايجنت">
<meta property="og:description" content="آخر أخبار الانتقالات والشائعات الحقيقية بكرة القدم.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://charming-kringle-f53407.netlify.app/news.html">

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2747%27%20fill%3D%27%230F3D2E%27/%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2747%27%20fill%3D%27none%27%20stroke%3D%27%23C9973F%27%20stroke-width%3D%275%27/%3E%3Ctext%20x%3D%2750%27%20y%3D%2769%27%20font-family%3D%27Georgia%2C%20serif%27%20font-weight%3D%27700%27%20font-size%3D%2756%27%20fill%3D%27%23C9973F%27%20text-anchor%3D%27middle%27%3E%D9%83%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0F3D2E;
    --pitch-dark:#0A2B20;
    --cream:#F6F3EC;
    --gold:#C9973F;
    --ink:#1A1F1C;
    --ink-soft:#565f59;
    --line-red:#C0392B;
    --card:#FFFFFF;
    --line:#E4DFD2;
    --crest-bg:#F3F1EA;
    --shadow-sm:0 1px 3px rgba(10,20,15,0.07), 0 1px 2px rgba(10,20,15,0.05);
    --shadow-md:0 6px 20px rgba(10,20,15,0.10), 0 2px 6px rgba(10,20,15,0.06);
    --shadow-lg:0 16px 40px rgba(10,20,15,0.16);
  }
  :root[data-theme="dark"]{
    --cream:#121712;
    --card:#1c241d;
    --ink:#EFEFEA;
    --ink-soft:#9AA39A;
    --line:#2b352c;
    --shadow-sm:0 1px 3px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.22);
    --shadow-md:0 6px 20px rgba(0,0,0,0.4);
    --shadow-lg:0 16px 40px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'Tajawal', sans-serif; line-height:1.5; overflow-x:hidden; }
  h1,h2,h3,.num,.brand{ font-family:'Changa', sans-serif; }
  .num, .score-block .num, .mr-badge, .rr-score, .tm-score, .article-score, .feed-score,
  .result-score, .hero-score, .ticker-item .t-score{ font-variant-numeric:tabular-nums; letter-spacing:.3px; }

  header{
    background:var(--pitch);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 0, transparent 45%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 68px);
    color:var(--cream); padding:22px 6vw 30px;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; gap:14px; }
  .brand{ font-size:26px; font-weight:900; color:var(--cream); display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    background:var(--pitch-dark); border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:'Changa'; font-weight:800; font-size:15px; color:var(--gold);
  }
  nav{ display:flex; align-items:center; gap:28px; font-size:15px; font-weight:700; flex-wrap:wrap; }
  nav a{ color:rgba(246,243,236,0.75); text-decoration:none; }
  nav a.active{ color:var(--gold); }
  .theme-toggle{
    width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06); color:var(--cream); cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .theme-toggle:hover{ border-color:var(--gold); }
  .hero-line{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .hero-line h1{ font-size:clamp(28px, 4vw, 40px); font-weight:800; }

  main{ max-width:1180px; margin:0 auto; padding:36px 6vw 60px; }

  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; padding-bottom:10px; border-bottom:2px solid var(--pitch);
  }
  .section-head h2{ font-size:20px; font-weight:800; }
  .league-badge{
    font-size:12px; font-weight:700; color:var(--pitch); background:rgba(15,61,46,0.08);
    padding:5px 12px; border-radius:100px;
  }

  .league-tabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
  .league-tab{
    font-size:13px; font-weight:700; padding:9px 16px; border-radius:20px;
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    cursor:pointer; transition:.15s; text-decoration:none; display:inline-block;
  }
  .league-tab:hover{ border-color:var(--gold); }
  .league-tab.active{ background:var(--pitch); color:#fff; border-color:var(--pitch); }

  .empty-state{
    padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:14px;
    background:var(--card); border:1px dashed var(--line); border-radius:10px;
  }

  /* ===== مساحات إعلانية (Google AdSense لاحقاً) ===== */
  .ad-slot{
    background:var(--card); border:1px dashed var(--line); border-radius:12px;
    min-height:100px; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:11px; font-weight:700; margin:24px 0; letter-spacing:.5px;
  }


  /* ===== أخبار حقيقية (RSS) - بطاقات بشبكة فيها ملخص وافي ===== */
  #real-news-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:18px; }
  .real-news-card{
    display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line);
    border-radius:14px; overflow:hidden; text-decoration:none; color:inherit;
    box-shadow:var(--shadow-sm); transition:box-shadow .15s, transform .15s;
  }
  .real-news-card:hover{ box-shadow:0 8px 18px rgba(26,31,28,0.1); transform:translateY(-2px); }
  .real-news-card .rn-image{ width:100%; height:160px; flex-shrink:0; background:var(--pitch); overflow:hidden; }
  .real-news-card .rn-image img{ width:100%; height:100%; object-fit:cover; }
  .real-news-card .rn-body{ flex:1; min-width:0; padding:16px 18px; display:flex; flex-direction:column; gap:8px; }
  .real-news-card .rn-title{
    font-size:15.5px; font-weight:800; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .real-news-card .rn-excerpt{
    font-size:13px; color:var(--ink-soft); line-height:1.75;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }
  .real-news-card .rn-meta{ font-size:11.5px; color:var(--ink-soft); font-weight:700; margin-top:auto; padding-top:6px; }
  .real-news-card .rn-meta .rn-source{ color:var(--gold); }

  footer{
    background:var(--pitch-dark); color:rgba(246,243,236,0.55);
    text-align:center; padding:26px; font-size:13px; margin-top:40px;
  }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand"><span class="mark">ك</span> كورة ايجنت</div>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="matches.html">مباريات اليوم</a>
      <a href="results.html">النتائج</a>
      <a href="news.html" class="active">الأخبار</a>
      <a href="standings.html">الترتيب</a>
      <a href="clubs.html">الأندية</a>
      <a href="leagues.html">الدوريات</a>
      <a href="future.html">قريباً</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="تبديل الوضع الليلي"></button>
    </nav>
  </div>
  <div class="hero-line"><h1>الأخبار</h1></div>
</header>

<main>
  <div class="section-head">
    <h2 id="page-title">آخر الانتقالات والأخبار</h2>
    <span class="league-badge" id="real-news-count">0 خبر</span>
  </div>
  <div class="league-tabs" id="league-tabs"></div>
  <div id="real-news-list"></div>
  <!-- إعلان AdSense لاحقاً هنا --><div class="ad-slot">مساحة إعلانية</div>
</main>

<footer>&copy; كورة ايجنت 2026</footer>

<script>
const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
const MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('theme', t); }catch(e){}
  document.getElementById('theme-toggle').innerHTML = t === 'dark' ? SUN_ICON : MOON_ICON;
}
document.getElementById('theme-toggle').innerHTML =
  document.documentElement.getAttribute('data-theme') === 'dark' ? SUN_ICON : MOON_ICON;
document.getElementById('theme-toggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});

function timeAgoAr(pubDate){
  const diffMs = Date.now() - new Date(pubDate).getTime();
  const hours = Math.floor(diffMs / 3600000);
  if(hours < 1) return 'قبل دقائق';
  if(hours < 24) return `قبل ${hours} ساعة`;
  const days = Math.floor(hours / 24);
  return `قبل ${days} يوم`;
}

const LEAGUE_NAMES = {
  4668: "دوري روشن السعودي",
  4328: "الدوري الإنجليزي",
  4335: "الدوري الإسباني",
  4332: "الدوري الإيطالي",
  4331: "الدوري الألماني",
  4334: "الدوري الفرنسي",
};
const LEAGUE_ORDER = [4668, 4328, 4335, 4332, 4331, 4334];

const urlLeague = new URLSearchParams(location.search).get('league');
let activeLeague = urlLeague ? Number(urlLeague) : 'all';
let allNewsItems = [];

function renderLeagueTabs(){
  const wrap = document.getElementById('league-tabs');
  let html = `<button type="button" class="league-tab ${activeLeague === 'all' ? 'active' : ''}" data-league="all">الكل</button>`;
  html += LEAGUE_ORDER.map(id => `
    <button type="button" class="league-tab ${activeLeague === id ? 'active' : ''}" data-league="${id}">
      ${LEAGUE_NAMES[id]}
    </button>`).join('');
  wrap.innerHTML = html;

  wrap.querySelectorAll('.league-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.league;
      activeLeague = val === 'all' ? 'all' : Number(val);
      const url = new URL(location.href);
      if(activeLeague === 'all') url.searchParams.delete('league');
      else url.searchParams.set('league', activeLeague);
      history.replaceState(null, '', url);
      renderLeagueTabs();
      renderRealNews();
      document.getElementById('page-title').textContent =
        activeLeague === 'all' ? 'آخر الانتقالات والأخبار' : `أخبار ${LEAGUE_NAMES[activeLeague]}`;
    });
  });
}

function renderRealNews(){
  const list = document.getElementById('real-news-list');
  const items = activeLeague === 'all'
    ? allNewsItems
    : allNewsItems.filter(n => n.league_id === activeLeague);

  document.getElementById('real-news-count').textContent = items.length + ' خبر';

  if(items.length === 0){
    list.innerHTML = '<div class="empty-state" style="grid-column:1/-1">ما فيه أخبار حقيقية مجهزة حالياً لهذا الدوري — راجع لاحقاً بعد تحديث البيانات</div>';
    return;
  }

  list.innerHTML = items.map(n => `
    <a class="real-news-card" href="${n.link}" target="_blank" rel="noopener">
      ${n.image ? `<div class="rn-image"><img src="${n.image}" alt="" loading="lazy" onerror="this.parentElement.remove()"></div>` : ''}
      <div class="rn-body">
        <div class="rn-title">${n.title}</div>
        ${n.excerpt ? `<div class="rn-excerpt">${n.excerpt}</div>` : ''}
        <div class="rn-meta"><span class="rn-source">${n.source}</span>${n.published ? ' · ' + timeAgoAr(n.published) : ''}</div>
      </div>
    </a>`).join('');
}

if(activeLeague !== 'all'){
  document.getElementById('page-title').textContent = `أخبار ${LEAGUE_NAMES[activeLeague] || ''}`;
}
renderLeagueTabs();

fetch('real_news.json?t=' + Date.now())
  .then(res => { if(!res.ok) throw 0; return res.json(); })
  .then(data => { allNewsItems = data || []; renderRealNews(); })
  .catch(() => { allNewsItems = []; renderRealNews(); });
</script>

</body>
</html>
