name: تحديث نتائج المباريات

# يشتغل تلقائياً كل 30 دقيقة، وكمان تقدر تشغّله يدوياً من تبويب Actions
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# صلاحية الكتابة لازمة عشان يقدر يحفظ matches.json و standings.json و news.json بالمستودع
permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل نسخة من المستودع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات المطلوبة
        run: pip install requests google-genai

      - name: تشغيل سكربت جلب المباريات
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python football_agent_gemini.py

      - name: حفظ ورفع matches.json و standings.json و news.json الجديدة
        run: |
          git config user.name "football-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add matches.json standings.json news.json real_news.json results_archive.json squads.json sync_state.json cover_images.json players_bio.json
          git diff --staged --quiet || git commit -m "تحديث تلقائي لنتائج المباريات والترتيب والأخبار"
          git pull --rebase origin main
          git push
          # GitHub Pages ينشر تلقائياً مع كل push على main - ما نحتاج خطوة نشر منفصلة
