<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كورة ايجنت | نتائج وأخبار كرة القدم</title>
<meta name="description" content="نتائج وأخبار دوري روشن السعودي والدوريات الأوروبية الخمس الكبرى لحظة بلحظة، مع جدول الترتيب وصفحات الأندية.">
<meta property="og:title" content="كورة ايجنت | نتائج وأخبار كرة القدم">
<meta property="og:description" content="نتائج وأخبار دوري روشن السعودي والدوريات الأوروبية الخمس الكبرى لحظة بلحظة.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://charming-kringle-f53407.netlify.app/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2747%27%20fill%3D%27%230F3D2E%27/%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2747%27%20fill%3D%27none%27%20stroke%3D%27%23C9973F%27%20stroke-width%3D%275%27/%3E%3Ctext%20x%3D%2750%27%20y%3D%2769%27%20font-family%3D%27Georgia%2C%20serif%27%20font-weight%3D%27700%27%20font-size%3D%2756%27%20fill%3D%27%23C9973F%27%20text-anchor%3D%27middle%27%3E%D9%83%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0F3D2E;
    --pitch-dark:#0A2B20;
    --cream:#F6F3EC;
    --gold:#C9973F;
    --ink:#1A1F1C;
    --ink-soft:#565f59;
    --line-red:#C0392B;
    --card:#FFFFFF;
    --line:#E4DFD2;
  }
  :root[data-theme="dark"]{
    --cream:#121712;
    --card:#1c241d;
    --ink:#EFEFEA;
    --ink-soft:#9AA39A;
    --line:#2b352c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    line-height:1.5;
    overflow-x:hidden;
  }
  h1,h2,h3,.num,.brand{ font-family:'Almarai', sans-serif; }

  /* ===== Header ===== */
  header{
    background:var(--pitch);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 0, transparent 45%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 68px);
    color:var(--cream);
    padding:22px 6vw 30px;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:26px;
  }
  .brand{
    font-size:26px; font-weight:900; color:var(--cream);
    display:flex; align-items:center; gap:10px;
  }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--gold); }
  nav{ display:flex; align-items:center; gap:28px; font-size:15px; font-weight:700; flex-wrap:wrap; }
  nav a{ color:rgba(246,243,236,0.75); text-decoration:none; }
  nav a.active{ color:var(--gold); }
  .theme-toggle{
    width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06); color:var(--cream); cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .theme-toggle:hover{ border-color:var(--gold); }

  .hero-line{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  .hero-line h1{
    font-size:clamp(28px, 4vw, 40px);
    font-weight:800;
  }
  .hero-line .date-tag{
    color:var(--gold); font-weight:700; font-size:15px;
    border:1px solid rgba(201,151,63,0.5); padding:4px 12px; border-radius:100px;
  }

  /* ===== Ticker ===== */
  .ticker-wrap{
    background:var(--pitch-dark); border-top:1px solid rgba(255,255,255,0.08);
    margin:22px -6vw 0; padding:0 6vw;
  }
  .ticker{
    display:flex; gap:0; overflow-x:auto; scrollbar-width:none;
  }
  .ticker::-webkit-scrollbar{ display:none; }
  .ticker-item{
    flex-shrink:0; display:flex; align-items:center; gap:9px;
    padding:13px 20px; border-left:1px solid rgba(255,255,255,0.08);
    font-size:12.5px; font-weight:700; color:rgba(246,243,236,0.85); white-space:nowrap;
  }
  .ticker-item .t-crest{ width:18px; height:18px; border-radius:50%; overflow:hidden; flex-shrink:0; background:rgba(255,255,255,0.1); }
  .ticker-item .t-crest img{ width:100%; height:100%; object-fit:contain; }
  .ticker-item .t-score{ color:var(--gold); font-family:'Almarai'; font-weight:900; }
  .ticker-item.live .t-score{ color:#e8664f; }

  /* ===== Layout ===== */
  main{
    max-width:1180px; margin:0 auto; padding:0 6vw 60px;
    display:grid; grid-template-columns: 1fr 340px; gap:40px;
  }
  /* بدون min-width:0 هذي، أي صف أفقي مزدحم (زي يوم فيه مباريات كثيرة)
     يقدر يوسّع عمود الجدول (grid track) نفسه بدل ما ينسحب داخل حدوده،
     وهذا اللي كان يخلي الصفحة كلها تنزاح يسار بدل ما تضل متوسطة */
  main > div, main > aside{ min-width:0; }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } }

  section{ margin-top:44px; }
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; padding-bottom:10px; border-bottom:2px solid var(--pitch);
  }
  .section-head h2{ font-size:20px; font-weight:800; }
  .section-head .league-badge{
    font-size:12px; font-weight:700; color:var(--pitch); background:rgba(15,61,46,0.08);
    padding:5px 12px; border-radius:100px;
  }

  /* ===== Hero story (featured match) ===== */
  .hero-story{
    position:relative; border-radius:16px; overflow:hidden; min-height:280px;
    background:linear-gradient(135deg, var(--pitch) 0%, var(--pitch-dark) 100%);
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:28px 30px; margin-bottom:22px; isolation:isolate;
  }
  .hero-story::before{
    content:''; position:absolute; inset:0; z-index:-1;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 70px);
  }
  .hero-story::after{
    content:''; position:absolute; inset:0; z-index:-1;
    background:linear-gradient(0deg, rgba(10,20,15,0.92) 5%, rgba(10,20,15,0.25) 60%, transparent 100%);
  }
  .hero-crests{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:-2;
    display:flex; align-items:center; gap:6vw; opacity:0.16; filter:grayscale(1) brightness(3);
  }
  .hero-crests img{ width:min(22vw,220px); height:min(22vw,220px); object-fit:contain; }
  .hero-meta{
    display:flex; align-items:center; gap:10px; margin-bottom:12px;
  }
  .hero-tag{
    font-size:11.5px; font-weight:800; color:var(--pitch-dark); background:var(--gold);
    padding:5px 13px; border-radius:100px; letter-spacing:.3px;
  }
  .hero-live{
    font-size:11.5px; font-weight:800; color:#fff; background:var(--line-red);
    padding:5px 13px; border-radius:100px; display:flex; align-items:center; gap:5px;
  }
  .hero-score{
    color:var(--cream); font-family:'Almarai'; font-weight:900;
    font-size:clamp(30px,4.4vw,46px); letter-spacing:1px; margin-bottom:6px;
  }
  .hero-score .vs{ font-size:.5em; color:var(--gold); font-weight:700; margin:0 10px; }
  .hero-title{
    color:var(--cream); font-size:clamp(18px,2.3vw,26px); font-weight:800; line-height:1.4;
    max-width:640px;
  }
  .hero-story .article-preview{
    color:rgba(246,243,236,0.7); margin-top:12px; max-width:640px;
    border-top:1px solid rgba(255,255,255,0.12); padding-top:12px;
  }

  /* ===== Hero slider ===== */
  .hero-slider{ position:relative; margin-bottom:22px; }
  .hero-slider .hero-story{ margin-bottom:0; }
  .hero-slider-track{ position:relative; min-height:280px; }
  .hero-slider-track .hero-story{
    position:absolute; inset:0; opacity:0; pointer-events:none;
    transition:opacity .5s ease;
  }
  .hero-slider-track .hero-story.active{ position:relative; opacity:1; pointer-events:auto; }
  .hero-nav-btn{
    position:absolute; top:50%; transform:translateY(-50%); z-index:2;
    width:36px; height:36px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(0,0,0,0.35); color:#fff; font-size:16px; display:flex;
    align-items:center; justify-content:center; transition:.15s;
  }
  .hero-nav-btn:hover{ background:rgba(0,0,0,0.55); }
  .hero-nav-btn.prev{ right:14px; }
  .hero-nav-btn.next{ left:14px; }
  .hero-dots{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%); z-index:2;
    display:flex; gap:7px;
  }
  .hero-dot{
    width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.35);
    border:none; cursor:pointer; padding:0; transition:.15s;
  }
  .hero-dot.active{ background:var(--gold); width:22px; border-radius:5px; }

  /* ===== Match Card (story grid) ===== */
  .story-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .story-grid{ grid-template-columns:1fr; } }

  .match-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:0;
    display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:14px;
    position:relative; overflow:hidden;
    box-shadow:0 1px 2px rgba(26,31,28,0.04);
    transition:box-shadow .15s, transform .15s;
  }
  .match-card:hover{ box-shadow:0 10px 24px rgba(26,31,28,0.1); transform:translateY(-2px); }
  .match-card::before{
    content:''; position:absolute; top:0; right:0; bottom:0; width:4px; background:var(--pitch);
  }
  .match-card.live::before{ background:var(--line-red); }
  .match-card .cover{
    grid-column:1/-1; margin:-20px -20px 0; height:150px; overflow:hidden;
    position:relative; background:var(--pitch);
  }
  .match-card .cover img{ width:100%; height:100%; object-fit:cover; transition:transform .3s ease; }
  .match-card:hover .cover img{ transform:scale(1.04); }
  .match-card .cover .illustrative-badge{
    position:absolute; bottom:8px; left:8px;
    font-size:9.5px; font-weight:700; color:#fff; background:rgba(10,20,15,0.6);
    padding:3px 9px; border-radius:100px;
  }
  .match-card .league-tag{
    grid-column:1/-1; font-size:10.5px; font-weight:800; color:var(--gold);
    text-transform:uppercase; letter-spacing:.4px; margin-bottom:-4px;
  }
  .team{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:14.5px; }
  .team.away{ flex-direction:row-reverse; text-align:left; justify-content:flex-start; }
  .crest{
    width:36px; height:36px; border-radius:50%;
    background:var(--pitch); color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    font-family:'Almarai'; font-weight:800; font-size:13px; flex-shrink:0;
    overflow:hidden; box-shadow:0 0 0 3px var(--cream), 0 0 0 4px var(--line);
  }
  .crest img{ width:100%; height:100%; object-fit:contain; padding:3px; }
  .score-block{ text-align:center; min-width:96px; }
  .score-block .num{ font-family:'Almarai'; font-size:26px; font-weight:900; letter-spacing:2px; }
  .score-block .status{
    font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-top:2px;
  }
  .match-card.live .status{ color:var(--line-red); }
  .status .live-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--line-red); margin-left:5px; animation:pulse 1.4s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  .article-preview{
    grid-column:1/-1; margin-top:10px; padding-top:12px; border-top:1px dashed var(--line);
    font-size:13.5px; color:var(--ink-soft); line-height:1.7;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }

  /* ===== Sidebar ===== */
  .sidebar-card{
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px;
  }
  #news-list{
    display:flex; gap:12px; overflow-x:auto; padding:6px 2px; scrollbar-width:thin;
  }
  .news-item{
    display:block; flex:0 0 210px; padding:14px; border:1px solid var(--line); border-radius:10px;
    text-decoration:none; color:inherit; background:var(--cream);
  }
  .news-item .tag{
    font-size:11px; font-weight:700; color:var(--gold); margin-bottom:4px; display:block;
  }
  .news-item .title{ font-size:13.5px; font-weight:700; line-height:1.5; }

  .league-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .league-tab{
    font-size:11.5px; font-weight:700; padding:6px 10px; border-radius:20px;
    border:1px solid var(--line); background:var(--cream); color:var(--ink-soft);
    cursor:pointer; transition:.15s;
  }
  .league-tab:hover{ border-color:var(--gold); }
  .league-tab.active{ background:var(--pitch); color:#fff; border-color:var(--pitch); }

  /* ===== Match league tabs (مباريات اليوم) ===== */
  .match-league-tabs{
    display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; margin-bottom:24px;
    scrollbar-width:none;
  }
  .match-league-tabs::-webkit-scrollbar{ display:none; }
  .match-league-tab{
    flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:7px;
    padding:14px 18px; min-width:90px; border-radius:14px;
    border:1px solid var(--line); background:var(--card); cursor:pointer; transition:.15s;
  }
  .match-league-tab:hover{ border-color:var(--gold); transform:translateY(-1px); }
  .match-league-tab.active{ background:var(--pitch); border-color:var(--pitch); }
  .match-league-tab .m-logo{ width:32px; height:32px; object-fit:contain; }
  .match-league-tab .m-name{ font-size:10.5px; font-weight:700; color:var(--ink-soft); text-align:center; line-height:1.3; }
  .match-league-tab .m-count{ font-size:11px; font-weight:800; color:var(--pitch); }
  .match-league-tab.active .m-name{ color:rgba(246,243,236,0.8); }
  .match-league-tab.active .m-count{ color:var(--gold); }

  .kickoff-time{ font-family:'Almarai'; font-size:19px; font-weight:900; color:var(--pitch); }
  .kickoff-label{ font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-top:2px; }

  /* ===== Day tabs ===== */
  .day-tabs{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px;
    scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{ display:none; }
  .day-tab{
    flex-shrink:0; min-width:78px; text-align:center; font-size:12.5px; font-weight:700;
    padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); cursor:pointer; transition:.15s;
  }
  .day-tab .d-sub{ display:block; font-size:10px; font-weight:600; opacity:.75; margin-top:2px; }
  .day-tab:hover{ border-color:var(--gold); }
  .day-tab.active{ background:var(--gold); color:var(--pitch-dark); border-color:var(--gold); }

  /* ===== صفوف قابلة للسحب أفقياً بالماوس ===== */
  .drag-scroll{ cursor:grab; }
  .drag-scroll.dragging{ cursor:grabbing; user-select:none; scroll-behavior:auto; }

  /* ===== Ticker-style compact match cards ===== */
  .ticker-row{ display:flex; gap:12px; overflow-x:auto; padding:4px 2px 16px; scrollbar-width:thin; }
  .tmatch-card{
    flex:0 0 190px; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 12px; text-align:center; position:relative;
  }
  .tmatch-card.live{ border-color:var(--line-red); }
  .tmatch-card .tm-league{
    font-size:10px; font-weight:800; color:var(--gold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tmatch-card .tm-round{ font-size:9.5px; color:var(--ink-soft); margin-bottom:8px; }
  .tmatch-card .tm-time{ font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:10px; }
  .tmatch-card.live .tm-time{ color:var(--line-red); }
  .tmatch-card .tm-teams{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .tmatch-card .tm-team{ display:flex; flex-direction:column; align-items:center; gap:5px; flex:1; min-width:0; }
  .tmatch-card .tm-team .crest{ width:30px; height:30px; box-shadow:none; }
  .tmatch-card .tm-team span{
    font-size:10.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .tmatch-card .tm-score{ font-family:'Almarai'; font-size:17px; font-weight:900; flex-shrink:0; padding:0 4px; }

  .standings-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .standings-table th{
    text-align:right; font-weight:700; color:var(--ink-soft); font-size:11px;
    padding-bottom:10px; border-bottom:2px solid var(--pitch);
  }
  .standings-table td{ padding:9px 0; border-bottom:1px solid var(--line); font-weight:600; }
  .standings-table td.rank{ color:var(--gold); font-weight:800; width:24px; }
  .standings-table td.pts{ font-weight:800; text-align:center; }

  .empty-state{
    padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:14px;
    background:var(--card); border:1px dashed var(--line); border-radius:10px;
  }

  footer{
    background:var(--pitch-dark); color:rgba(246,243,236,0.55);
    text-align:center; padding:26px; font-size:13px; margin-top:40px;
  }
  footer strong{ color:var(--gold); }

  /* ===== أهم المسابقات ===== */
  .comp-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px; }
  .comp-card{
    display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 8px;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    text-decoration:none; color:inherit; transition:.15s;
  }
  .comp-card:hover{ border-color:var(--gold); transform:translateY(-2px); box-shadow:0 8px 16px rgba(26,31,28,0.08); }
  .comp-card img{ width:36px; height:36px; object-fit:contain; }
  .comp-card span{ font-size:11.5px; font-weight:700; text-align:center; line-height:1.4; }

  /* ===== آخر الأخبار (تغذية كاملة) ===== */
  .feed-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:14px; position:relative; overflow:hidden;
    box-shadow:0 1px 2px rgba(26,31,28,0.04);
  }
  .feed-card::before{ content:''; position:absolute; top:0; right:0; bottom:0; width:4px; background:var(--pitch); }
  .feed-card.live::before{ background:var(--line-red); }
  .feed-meta{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .feed-meta .league-tag{
    font-size:10.5px; font-weight:800; color:var(--gold); text-transform:uppercase; letter-spacing:.4px;
  }
  .feed-teams{ display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:14px; }
  .feed-team{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
  .feed-team .crest{ width:38px; height:38px; }
  .feed-team span{ font-weight:700; font-size:12.5px; text-align:center; }
  .feed-score{ font-family:'Almarai'; font-size:22px; font-weight:900; flex-shrink:0; }
  .feed-body{ font-size:13.5px; color:var(--ink-soft); line-height:1.85; border-top:1px dashed var(--line); padding-top:12px; }
</style>
</head>

<header>

    <div class="brand"><span class="dot"></span> كورة ايجنت</div>
    <nav>
      <a href="index.html" class="active">الرئيسية</a>
      <a href="matches.html">مباريات اليوم</a>

/* ============================================================

const sampleMatches = [

function initials(name){
  return name.trim().split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function crest(name, logoUrl){
  if(logoUrl){
    return `<img src="${logoUrl}" alt="${name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'), {textContent:'${initials(name)}'}))">`;
  }
  return initials(name);
}

const MATCH_TARGET_LEAGUES = {
  4668: "دوري روشن السعودي",
  4328: "الدوري الإنجليزي",
  4335: "الدوري الإسباني",
  4332: "الدوري الإيطالي",
  4331: "الدوري الألماني",
  4334: "الدوري الفرنسي",
};

function isLiveStatus(status){ return status === 'In Play' || status === 'Halftime'; }
function isScheduled(status){ return status === 'Not Started'; }

function formatKickoff(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString('ar', { hour:'2-digit', minute:'2-digit' });
}

function statusLabelFor(m){
  if(isLiveStatus(m.status)) return '<span class="live-dot"></span> مباشر الآن';
  if(isScheduled(m.status)) return 'لم تبدأ بعد';
  if(m.status === 'Match Finished') return 'انتهت المباراة';
  return m.status;
}

function scoreBlockHtml(m){
  if(isScheduled(m.status)){
    return `<div class="kickoff-time">${formatKickoff(m.date)}</div><div class="kickoff-label">${statusLabelFor(m)}</div>`;
  }
  return `<div class="num">${m.home_score} - ${m.away_score}</div><div class="status">${statusLabelFor(m)}</div>`;
}

/* أهم المباريات تُعرض بسلايدر البطاقة الكبيرة: مباشرة الآن أولاً، وإلا
   منتهية بدوري من دورياتنا المتابعة، وإلا أي منتهية، وإلا القادمة الأقرب
   موعداً. نأخذ أفضل 5 كحد أقصى للسلايدر */
function pickHeroSlides(matches, n = 5){
  const score = m => {
    const inTarget = MATCH_TARGET_LEAGUES[m.league_id] !== undefined;
    if(isLiveStatus(m.status)) return inTarget ? 0 : 1;
    if(m.status === 'Match Finished') return inTarget ? 2 : 3;
    return inTarget ? 4 : 5;
  };
  return [...matches].sort((a, b) => {
    const s = score(a) - score(b);
    if(s !== 0) return s;
    return new Date(a.date) - new Date(b.date);
  }).slice(0, n);
}

function heroStoryHtml(m, active){
  const isLive = isLiveStatus(m.status);
  const scheduled = isScheduled(m.status);

  const centerHtml = scheduled
    ? `<div class="hero-score">${formatKickoff(m.date)}</div>`
    : `<div class="hero-score">${m.home_score} <span class="vs">-</span> ${m.away_score}</div>`;

  return `
    <div class="hero-story ${active ? 'active' : ''}">
      <div class="hero-crests">
        ${m.home_logo ? `<img src="${m.home_logo}">` : ''}
        ${m.away_logo ? `<img src="${m.away_logo}">` : ''}
      </div>
      <div class="hero-meta">
        <span class="hero-tag">${m.league}</span>
        ${isLive ? '<span class="hero-live"><span class="live-dot"></span> مباشر</span>' : ''}
        ${scheduled ? '<span class="hero-live" style="background:var(--ink-soft)">لم تبدأ بعد</span>' : ''}
      </div>
      ${centerHtml}
      <div class="hero-title">${m.home_team} ${isLive || scheduled ? 'يواجه' : 'أمام'} ${m.away_team}</div>
      ${m.content ? `<div class="article-preview">${m.content}</div>` : ''}
    </div>`;
}

let heroSlideIndex = 0;
let heroAutoplayTimer = null;

function goToHeroSlide(idx, slides){
  const n = slides.length;
  heroSlideIndex = (idx + n) % n;
  document.querySelectorAll('.hero-story').forEach((el, i) => el.classList.toggle('active', i === heroSlideIndex));
  document.querySelectorAll('.hero-dot').forEach((el, i) => el.classList.toggle('active', i === heroSlideIndex));
}

function renderHeroStory(matches){
  const slot = document.getElementById('hero-story-slot');
  clearInterval(heroAutoplayTimer);

  if(!matches || matches.length === 0){ slot.innerHTML = ''; return []; }

  const slides = pickHeroSlides(matches);
  heroSlideIndex = 0;

  const singleSlide = slides.length === 1;
  slot.innerHTML = `
    <div class="hero-slider">
      <div class="hero-slider-track">
        ${slides.map((m, i) => heroStoryHtml(m, i === 0)).join('')}
      </div>
      ${!singleSlide ? `
        <button type="button" class="hero-nav-btn prev" aria-label="السابق">‹</button>
        <button type="button" class="hero-nav-btn next" aria-label="التالي">›</button>
        <div class="hero-dots">
          ${slides.map((_, i) => `<button type="button" class="hero-dot ${i === 0 ? 'active' : ''}"></button>`).join('')}
        </div>` : ''}
    </div>`;

  if(!singleSlide){
    slot.querySelector('.prev').addEventListener('click', () => goToHeroSlide(heroSlideIndex - 1, slides));
    slot.querySelector('.next').addEventListener('click', () => goToHeroSlide(heroSlideIndex + 1, slides));
    slot.querySelectorAll('.hero-dot').forEach((dot, i) => dot.addEventListener('click', () => goToHeroSlide(i, slides)));
    heroAutoplayTimer = setInterval(() => goToHeroSlide(heroSlideIndex + 1, slides), 6000);
  }

  return slides;
}

let allTodayMatches = [];
let activeMatchLeague = 'all';
let activeDay = null;

function dayKey(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}

function dayLabel(offset){
  if(offset === -1) return { main: 'أمس', sub: '' };
  if(offset === 0) return { main: 'اليوم', sub: '' };
  if(offset === 1) return { main: 'غداً', sub: '' };

  const d = new Date();
  d.setDate(d.getDate() + offset);
  const weekday = d.toLocaleDateString('ar', { weekday: 'long', calendar: 'gregory' });
  const dayMonth = d.toLocaleDateString('ar', { day: '2-digit', month: 'long', calendar: 'gregory' });
  return { main: weekday, sub: dayMonth };
}

const DAY_OFFSETS = [-2, -1, 0, 1, 2, 3];

function renderDayTabs(){
  const wrap = document.getElementById('day-tabs');
  wrap.innerHTML = DAY_OFFSETS.map(offset => {
    const key = dayKey(offset);
    const label = dayLabel(offset);
    return `
    <div class="day-tab ${activeDay === key ? 'active' : ''}" data-day="${key}">
      ${label.main}${label.sub ? `<span class="d-sub">${label.sub}</span>` : ''}
    </div>`;
  }).join('');

  wrap.querySelectorAll('.day-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activeDay = tab.dataset.day;
      renderDayTabs();
      refreshMatchesView();
    });
  });
}

function filterByActiveDay(matches){
  if(!activeDay) return matches;
  return matches.filter(m => m.day === activeDay);
}

function refreshMatchesView(){
  const dayMatches = filterByActiveDay(allTodayMatches);
  renderMatchLeagueTabs(dayMatches);
  renderMatches(filterByActiveLeague(dayMatches));
  renderFeaturedMatches();
}

function renderMatchLeagueTabs(matches){
  const wrap = document.getElementById('match-league-tabs');
  const leagueIds = Object.keys(MATCH_TARGET_LEAGUES).map(Number);

  const allCount = matches.length;
  let html = `
    <div class="match-league-tab ${activeMatchLeague === 'all' ? 'active' : ''}" data-league="all">
      <span class="m-name" style="font-weight:800">الكل</span>
      <span class="m-count">${allCount} مباراة</span>
    </div>`;

  html += leagueIds.map(id => {
    const sample = matches.find(m => m.league_id === id);
    const count = matches.filter(m => m.league_id === id).length;
    const logo = sample ? sample.league_logo : '';
    const name = MATCH_TARGET_LEAGUES[id];
    return `
    <div class="match-league-tab ${activeMatchLeague === id ? 'active' : ''}" data-league="${id}">
      ${logo ? `<img class="m-logo" src="${logo}" alt="${name}">` : ''}
      <span class="m-name">${name}</span>
      <span class="m-count">${count} مباراة</span>
    </div>`;
  }).join('');

  wrap.innerHTML = html;

  wrap.querySelectorAll('.match-league-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const val = tab.dataset.league;
      activeMatchLeague = (val === 'all') ? 'all' : Number(val);
      refreshMatchesView();
    });
  });
}

function filterByActiveLeague(matches){
  if(activeMatchLeague === 'all') return matches;
  return matches.filter(m => m.league_id === activeMatchLeague);
}

function matchCardHtml(m){
  const isLive = isLiveStatus(m.status);
  const scheduled = isScheduled(m.status);
  const timeOrStatus = scheduled ? formatKickoff(m.date) : statusLabelFor(m);

function renderMatches(matches){

/* "أهم المباريات" = مباريات فيها فريق (مضيف أو ضيف) من أعلى 3 مراكز

function topRankedTeamNames(){
  const names = new Set();
  Object.values(standingsByLeague).forEach(league => {

  const head = document.getElementById('featured-head');

  if(topTeams.size === 0){
    head.style.display = 'none';

  const dayMatches = filterByActiveDay(allTodayMatches);
  const featured = dayMatches.filter(m => topTeams.has(m.home_team) || topTeams.has(m.away_team));

  if(featured.length === 0){
    head.style.display = 'none';
    row.style.display = 'none';

function enableDragScroll(el){
  let isDown = false, startX = 0, startScroll = 0, moved = false;

  el.addEventListener('mousedown', e => {
    isDown = true; moved = false;
    startX = e.pageX; startScroll = el.scrollLeft;
    el.classList.add('dragging');
  });
  ['mouseleave', 'mouseup'].forEach(evt => el.addEventListener(evt, () => {
    isDown = false; el.classList.remove('dragging');
  }));
  el.addEventListener('mousemove', e => {
    if(!isDown) return;
    e.preventDefault();
    const dx = e.pageX - startX;
    if(Math.abs(dx) > 3) moved = true;
    el.scrollLeft = startScroll - dx;
  });
  // نمنع كليك بطاقة كانت بالأصل سحب، عشان ما نفتح رابط بالغلط
  el.addEventListener('click', e => { if(moved) e.stopPropagation(); }, true);
}

      <div class="feed-meta">
        <span class="league-tag">${m.league}</span>
        ${isLive ? '<span class="hero-live" style="font-size:10px;padding:3px 10px"><span class="live-dot"></span> مباشر</span>' : ''}
      </div>
      <div class="feed-teams">
        <div class="feed-team">
          <div class="crest">${crest(m.home_team, m.home_logo)}</div>
          <span>${m.home_team}</span>
        </div>
        <div class="feed-score">${m.home_score} - ${m.away_score}</div>
        <div class="feed-team">
          <div class="crest">${crest(m.away_team, m.away_logo)}</div>
          <span>${m.away_team}</span>
        </div>
      </div>
      <div class="feed-body">${m.content}</div>
    </article>`;
  }).join('');
}

function loadMatches(data){
  allTodayMatches = data;
  activeDay = dayKey(0);
  renderDayTabs();
  refreshMatchesView();
  renderTicker(allTodayMatches.filter(m => m.day === dayKey(0)));
  renderCompGrid(allTodayMatches);
  renderNewsFeed(allTodayMatches);
}

fetch('matches.json?t=' + Date.now())
  .then(res => { if(!res.ok) throw 0; return res.json(); })
  .then(data => loadMatches(data))
  .catch(() => loadMatches(sampleMatches));

fetch('standings.json?t=' + Date.now())
  .then(res => { if(!res.ok) throw 0; return res.json(); })
  .then(data => renderStandingsData(data))
  .catch(() => {}); // الجدول الثابت بالـ HTML يبقى كما هو لو ما لقينا الملف

fetch('news.json?t=' + Date.now())
  .then(res => { if(!res.ok) throw 0; return res.json(); })
  .then(data => {
    const combined = [...(data.saudi || []), ...(data.europe || [])];
    renderNews(combined.length ? combined : sampleNews);
  })
  .catch(() => renderNews(sampleNews));

/* سكور شبه مباشر: نفس آلية صفحة مباريات اليوم - نجيب live_scores.json
   كل 45 ثانية ونحدّث نتيجة/حالة أي مباراة جارية بكل أقسام الصفحة */
function applyLiveUpdates(liveList){
  if(!liveList || liveList.length === 0) return;
  const byId = new Map(liveList.map(l => [String(l.event_id), l]));
  let changed = false;
  allTodayMatches.forEach(m => {
    const live = byId.get(String(m.event_id));
    if(live && (m.home_score !== live.home_score || m.away_score !== live.away_score || m.status !== live.status)){
      m.home_score = live.home_score;
      m.away_score = live.away_score;
      m.status = live.status;
      changed = true;
    }
  });
  if(changed){
    refreshMatchesView();
    renderTicker(allTodayMatches.filter(m => m.day === dayKey(0)));
  }
}

setInterval(() => {
  fetch('live_scores.json?t=' + Date.now())
    .then(res => res.ok ? res.json() : [])
    .then(applyLiveUpdates)
    .catch(() => {});
}, 45000);
</script>
