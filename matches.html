<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مباريات اليوم | كورة ايجنت</title>
<meta name="description" content="جدول مباريات اليوم لدوري روشن السعودي والدوريات الأوروبية الخمس الكبرى، مقسّمة حسب البطولة.">
<meta property="og:title" content="مباريات اليوم | كورة ايجنت">
<meta property="og:type" content="website">
<meta property="og:url" content="https://charming-kringle-f53407.netlify.app/matches.html">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2747%27%20fill%3D%27%230F3D2E%27/%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2747%27%20fill%3D%27none%27%20stroke%3D%27%23C9973F%27%20stroke-width%3D%275%27/%3E%3Ctext%20x%3D%2750%27%20y%3D%2769%27%20font-family%3D%27Georgia%2C%20serif%27%20font-weight%3D%27700%27%20font-size%3D%2756%27%20fill%3D%27%23C9973F%27%20text-anchor%3D%27middle%27%3E%D9%83%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0F3D2E;
    --pitch-dark:#0A2B20;
    --cream:#F6F3EC;
    --gold:#C9973F;
    --ink:#1A1F1C;
    --ink-soft:#565f59;
    --line-red:#C0392B;
    --card:#FFFFFF;
    --line:#E4DFD2;
  }
  :root[data-theme="dark"]{
    --cream:#121712;
    --card:#1c241d;
    --ink:#EFEFEA;
    --ink-soft:#9AA39A;
    --line:#2b352c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'Tajawal', sans-serif; line-height:1.5; overflow-x:hidden; }
  h1,h2,h3,.num,.brand{ font-family:'Almarai', sans-serif; }

  header{
    background:var(--pitch);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 0, transparent 45%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 68px);
    color:var(--cream); padding:22px 6vw 30px;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; gap:14px; }
  .brand{ font-size:26px; font-weight:900; color:var(--cream); display:flex; align-items:center; gap:10px; }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--gold); }
  nav{ display:flex; align-items:center; gap:28px; font-size:15px; font-weight:700; flex-wrap:wrap; }
  nav a{ color:rgba(246,243,236,0.75); text-decoration:none; }
  nav a.active{ color:var(--gold); }
  .theme-toggle{
    width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06); color:var(--cream); cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .theme-toggle:hover{ border-color:var(--gold); }
  .hero-line{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .hero-line h1{ font-size:clamp(28px, 4vw, 40px); font-weight:800; }

  main{ max-width:900px; margin:0 auto; padding:36px 6vw 60px; }

  .drag-scroll{ cursor:grab; }
  .drag-scroll.dragging{ cursor:grabbing; user-select:none; }

  .day-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:26px; scrollbar-width:none; }
  .day-tabs::-webkit-scrollbar{ display:none; }
  .day-tab{
    flex-shrink:0; min-width:78px; text-align:center; font-size:12.5px; font-weight:700;
    padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); cursor:pointer; transition:.15s;
  }
  .day-tab .d-sub{ display:block; font-size:10px; font-weight:600; opacity:.75; margin-top:2px; }
  .day-tab:hover{ border-color:var(--gold); }
  .day-tab.active{ background:var(--gold); color:var(--pitch-dark); border-color:var(--gold); }

  .empty-state{
    padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:14px;
    background:var(--card); border:1px dashed var(--line); border-radius:10px;
  }

  /* ===== مجموعات الدوريات (تنسيق كورة) ===== */
  .league-group{ margin-bottom:28px; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .league-group-head{ display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); }
  .league-group-head img{ width:34px; height:34px; object-fit:contain; flex-shrink:0; }
  .league-group-head h3{ font-size:15px; font-weight:800; }
  .lg-round{
    margin-right:auto; font-size:11.5px; font-weight:700; color:var(--pitch);
    background:rgba(15,61,46,0.08); padding:5px 12px; border-radius:100px; flex-shrink:0;
  }

  .match-row{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;
    padding:14px 18px; border-bottom:1px solid var(--line);
  }
  .match-row:last-child{ border-bottom:none; }
  .mr-team{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:13.5px; min-width:0; }
  .mr-team.home{ justify-content:flex-end; }
  .mr-team.away{ justify-content:flex-start; }
  .mr-team span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mr-crest{ width:26px; height:26px; border-radius:50%; overflow:hidden; background:var(--pitch); flex-shrink:0; }
  .mr-crest img{ width:100%; height:100%; object-fit:contain; padding:2px; }
  .mr-badge{
    font-family:'Almarai'; font-weight:900; font-size:14px; text-align:center; min-width:64px;
    background:var(--cream); border:1px solid var(--line); border-radius:8px; padding:6px 10px;
  }
  .mr-badge.time{ font-size:13px; color:var(--ink-soft); }
  .mr-badge.live{ background:var(--line-red); color:#fff; border-color:var(--line-red); }
  .live-dot{ display:inline-block; width:5px; height:5px; border-radius:50%; background:currentColor; animation:pulse 1.4s infinite; margin-left:4px; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  footer{
    background:var(--pitch-dark); color:rgba(246,243,236,0.55);
    text-align:center; padding:26px; font-size:13px; margin-top:40px;
  }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> كورة ايجنت</div>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="matches.html" class="active">مباريات اليوم</a>
      <a href="results.html">النتائج</a>
      <a href="news.html">الأخبار</a>
      <a href="standings.html">الترتيب</a>
      <a href="clubs.html">الأندية</a>
      <a href="leagues.html">الدوريات</a>
      <a href="future.html">قريباً</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="تبديل الوضع الليلي"></button>
    </nav>
  </div>
  <div class="hero-line"><h1>مباريات اليوم</h1></div>
</header>

<main>
  <div class="day-tabs drag-scroll" id="day-tabs"></div>
  <div id="league-groups"></div>
</main>

<footer>&copy; كورة ايجنت 2026</footer>

<script>
const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
const MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('theme', t); }catch(e){}
  document.getElementById('theme-toggle').innerHTML = t === 'dark' ? SUN_ICON : MOON_ICON;
}
document.getElementById('theme-toggle').innerHTML =
  document.documentElement.getAttribute('data-theme') === 'dark' ? SUN_ICON : MOON_ICON;
document.getElementById('theme-toggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});

function enableDragScroll(el){
  let isDown = false, startX = 0, startScroll = 0;
  el.addEventListener('mousedown', e => { isDown = true; startX = e.pageX; startScroll = el.scrollLeft; el.classList.add('dragging'); });
  ['mouseleave', 'mouseup'].forEach(evt => el.addEventListener(evt, () => { isDown = false; el.classList.remove('dragging'); }));
  el.addEventListener('mousemove', e => {
    if(!isDown) return;
    e.preventDefault();
    el.scrollLeft = startScroll - (e.pageX - startX);
  });
}

function initials(name){
  return name.trim().split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function crest(name, logoUrl){
  if(logoUrl){
    return `<img src="${logoUrl}" alt="${name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'), {textContent:'${initials(name)}'}))">`;
  }
  return initials(name);
}

const MATCH_TARGET_LEAGUES = {
  4668: "دوري روشن السعودي",
  4328: "الدوري الإنجليزي",
  4335: "الدوري الإسباني",
  4332: "الدوري الإيطالي",
  4331: "الدوري الألماني",
  4334: "الدوري الفرنسي",
};

function isLiveStatus(status){ return status === 'In Play' || status === 'Halftime'; }
function isScheduled(status){ return status === 'Not Started'; }

function formatKickoff(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString('ar', { hour:'2-digit', minute:'2-digit' });
}

function dayKey(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}

function dayLabel(offset){
  if(offset === -1) return { main: 'أمس', sub: '' };
  if(offset === 0) return { main: 'اليوم', sub: '' };
  if(offset === 1) return { main: 'غداً', sub: '' };
  const d = new Date();
  d.setDate(d.getDate() + offset);
  const weekday = d.toLocaleDateString('ar', { weekday: 'long', calendar: 'gregory' });
  const dayMonth = d.toLocaleDateString('ar', { day: '2-digit', month: 'long', calendar: 'gregory' });
  return { main: weekday, sub: dayMonth };
}

const DAY_OFFSETS = [-2, -1, 0, 1, 2, 3];
let allMatches = [];
let activeDay = null;

function renderDayTabs(){
  const wrap = document.getElementById('day-tabs');
  wrap.innerHTML = DAY_OFFSETS.map(offset => {
    const key = dayKey(offset);
    const label = dayLabel(offset);
    return `
    <div class="day-tab ${activeDay === key ? 'active' : ''}" data-day="${key}">
      ${label.main}${label.sub ? `<span class="d-sub">${label.sub}</span>` : ''}
    </div>`;
  }).join('');

  wrap.querySelectorAll('.day-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activeDay = tab.dataset.day;
      renderDayTabs();
      renderLeagueGroups();
    });
  });
}

function matchRowHtml(m){
  const isLive = isLiveStatus(m.status);
  const scheduled = isScheduled(m.status);
  const badge = scheduled
    ? `<div class="mr-badge time">${formatKickoff(m.date)}</div>`
    : `<div class="mr-badge ${isLive ? 'live' : ''}">${m.home_score} - ${m.away_score}${isLive ? '<span class="live-dot"></span>' : ''}</div>`;

  return `
  <div class="match-row">
    <div class="mr-team home"><span>${m.home_team}</span><span class="mr-crest">${crest(m.home_team, m.home_logo)}</span></div>
    ${badge}
    <div class="mr-team away"><span class="mr-crest">${crest(m.away_team, m.away_logo)}</span><span>${m.away_team}</span></div>
  </div>`;
}

function renderLeagueGroups(){
  const wrap = document.getElementById('league-groups');
  const dayMatches = allMatches.filter(m => m.day === activeDay);

  const groups = Object.keys(MATCH_TARGET_LEAGUES).map(Number).map(id => ({
    id, name: MATCH_TARGET_LEAGUES[id],
    matches: dayMatches.filter(m => m.league_id === id),
  })).filter(g => g.matches.length > 0);

  if(groups.length === 0){
    wrap.innerHTML = '<div class="empty-state">ما فيه مباريات بهالتاريخ ضمن الدوريات المتابعة</div>';
    return;
  }

  wrap.innerHTML = groups.map(g => `
    <div class="league-group">
      <div class="league-group-head">
        ${g.matches[0].league_logo ? `<img src="${g.matches[0].league_logo}" alt="${g.name}">` : ''}
        <h3>${g.name}</h3>
        ${g.matches[0].round ? `<span class="lg-round">الجولة ${g.matches[0].round}</span>` : ''}
      </div>
      ${g.matches.map(matchRowHtml).join('')}
    </div>`).join('');
}

fetch('matches.json?t=' + Date.now())
  .then(res => { if(!res.ok) throw 0; return res.json(); })
  .then(data => {
    allMatches = data;
    activeDay = dayKey(0);
    renderDayTabs();
    renderLeagueGroups();
    enableDragScroll(document.getElementById('day-tabs'));
  })
  .catch(() => {
    document.getElementById('league-groups').innerHTML = '<div class="empty-state">تعذّر تحميل المباريات</div>';
  });

/* سكور شبه مباشر: نجيب live_scores.json كل 45 ثانية (يتحدّث هو نفسه كل
   دقيقة أو دقيقتين من سكربت خفيف مستقل) ونحدّث نتيجة/حالة أي مباراة
   جارية بدون ما يحتاج الزائر يعيد تحميل الصفحة */
function applyLiveUpdates(liveList){
  if(!liveList || liveList.length === 0) return;
  const byId = new Map(liveList.map(l => [String(l.event_id), l]));
  let changed = false;
  allMatches.forEach(m => {
    const live = byId.get(String(m.event_id));
    if(live && (m.home_score !== live.home_score || m.away_score !== live.away_score || m.status !== live.status)){
      m.home_score = live.home_score;
      m.away_score = live.away_score;
      m.status = live.status;
      changed = true;
    }
  });
  if(changed) renderLeagueGroups();
}

setInterval(() => {
  fetch('live_scores.json?t=' + Date.now())
    .then(res => res.ok ? res.json() : [])
    .then(applyLiveUpdates)
    .catch(() => {});
}, 45000);
</script>

</body>
</html>
