<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأخبار | كورة ايجنت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0F3D2E;
    --pitch-dark:#0A2B20;
    --cream:#F6F3EC;
    --gold:#C9973F;
    --ink:#1A1F1C;
    --ink-soft:#565f59;
    --line-red:#C0392B;
    --card:#FFFFFF;
    --line:#E4DFD2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'Tajawal', sans-serif; line-height:1.5; }
  h1,h2,h3,.num,.brand{ font-family:'Cairo', sans-serif; }

  header{
    background:var(--pitch);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 0, transparent 45%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 68px);
    color:var(--cream); padding:22px 6vw 30px;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; }
  .brand{ font-size:26px; font-weight:900; color:var(--cream); display:flex; align-items:center; gap:10px; }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--gold); }
  nav{ display:flex; gap:28px; font-size:15px; font-weight:700; }
  nav a{ color:rgba(246,243,236,0.75); text-decoration:none; }
  nav a.active{ color:var(--gold); }
  .hero-line{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .hero-line h1{ font-size:clamp(28px, 4vw, 40px); font-weight:800; }

  .headline-strip-wrap{ background:var(--pitch-dark); border-top:1px solid rgba(255,255,255,0.08); }
  .headline-strip{ max-width:1180px; margin:0 auto; padding:14px 6vw; display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; }
  .headline-strip::-webkit-scrollbar{ display:none; }
  .headline-chip{
    flex-shrink:0; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
    border-radius:10px; padding:10px 16px; max-width:260px;
  }
  .headline-chip .tag{ font-size:10.5px; font-weight:800; color:var(--gold); display:block; margin-bottom:3px; }
  .headline-chip .title{ font-size:13px; font-weight:700; color:var(--cream); line-height:1.5; }

  main{ max-width:820px; margin:0 auto; padding:36px 6vw 60px; }

  .category-tabs{ display:flex; gap:8px; margin-bottom:24px; }
  .category-tab{
    flex:1; text-align:center; font-size:14.5px; font-weight:800; padding:13px 10px;
    border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    cursor:pointer; transition:.15s;
  }
  .category-tab:hover{ border-color:var(--gold); }
  .category-tab.active{ background:var(--pitch); color:#fff; border-color:var(--pitch); }

  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; padding-bottom:10px; border-bottom:2px solid var(--pitch);
  }
  .section-head h2{ font-size:20px; font-weight:800; }
  .league-badge{
    font-size:12px; font-weight:700; color:var(--pitch); background:rgba(15,61,46,0.08);
    padding:5px 12px; border-radius:100px;
  }

  .article-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:22px; margin-bottom:16px; position:relative; overflow:hidden;
    box-shadow:0 1px 2px rgba(26,31,28,0.04);
  }
  .article-card::before{ content:''; position:absolute; top:0; right:0; bottom:0; width:4px; background:var(--pitch); }
  .article-card.live::before{ background:var(--line-red); }

  .article-cover{
    margin:-22px -22px 18px; height:200px; overflow:hidden; position:relative;
    background:var(--pitch);
  }
  .article-cover img{
    width:100%; height:100%; object-fit:cover; object-position:center;
    transition:transform .3s ease;
  }
  .article-card:hover .article-cover img{ transform:scale(1.04); }
  .article-cover .illustrative-badge{
    position:absolute; bottom:10px; left:10px; z-index:1;
    font-size:10px; font-weight:700; color:#fff; background:rgba(10,20,15,0.6);
    padding:4px 10px; border-radius:100px; backdrop-filter:blur(2px);
  }
  .article-meta{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .article-meta .league-tag{
    font-size:10.5px; font-weight:800; color:var(--gold); text-transform:uppercase; letter-spacing:.4px;
  }
  .article-meta .live-pill{
    font-size:10.5px; font-weight:800; color:#fff; background:var(--line-red);
    padding:3px 10px; border-radius:100px; display:flex; align-items:center; gap:5px;
  }
  .live-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:currentColor; animation:pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  .article-teams{ display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:16px; }
  .article-team{ display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; }
  .crest{
    width:46px; height:46px; border-radius:50%; overflow:hidden; flex-shrink:0;
    box-shadow:0 0 0 3px var(--cream), 0 0 0 4px var(--line); background:var(--pitch);
  }
  .crest img{ width:100%; height:100%; object-fit:contain; padding:4px; }
  .article-team span{ font-weight:700; font-size:13.5px; text-align:center; }
  .article-score{ font-family:'Cairo'; font-size:28px; font-weight:900; letter-spacing:2px; flex-shrink:0; }

  .article-body{ font-size:14.5px; color:var(--ink-soft); line-height:1.9; border-top:1px dashed var(--line); padding-top:14px; }

  .empty-state{
    padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:14px;
    background:var(--card); border:1px dashed var(--line); border-radius:10px;
  }

  footer{
    background:var(--pitch-dark); color:rgba(246,243,236,0.55);
    text-align:center; padding:26px; font-size:13px; margin-top:40px;
  }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand"><span class="dot"></span> كورة ايجنت</div>
    <nav>
      <a href="index.html">مباريات اليوم</a>
      <a href="news.html" class="active">الأخبار</a>
      <a href="standings.html">الترتيب</a>
      <a href="clubs.html">الأندية</a>
    </nav>
  </div>
  <div class="hero-line"><h1>الأخبار</h1></div>
</header>

<div class="headline-strip-wrap"><div class="headline-strip" id="headline-strip"></div></div>

<main>
  <div class="category-tabs">
    <button type="button" class="category-tab active" data-cat="saudi">دوري روشن السعودي</button>
    <button type="button" class="category-tab" data-cat="europe">الدوريات الأوروبية</button>
  </div>

  <div class="section-head">
    <h2 id="section-title">أخبار دوري روشن السعودي</h2>
    <span class="league-badge" id="article-count">0 خبر</span>
  </div>
  <div id="articles-list"></div>
</main>

<footer>&copy; كورة ايجنت 2026</footer>

<script>
function initials(name){
  return name.trim().split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function crest(name, logoUrl){
  if(logoUrl){
    return `<img src="${logoUrl}" alt="${name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'), {textContent:'${initials(name)}'}))">`;
  }
  return initials(name);
}

const SAUDI_LEAGUE_ID = 307;
const EURO_LEAGUE_IDS = [39, 140, 135, 78, 61];

let allMatches = [];
let allNews = { saudi: [], europe: [] };
let activeCategory = 'saudi';

function renderHeadlines(){
  const el = document.getElementById('headline-strip');
  const items = allNews[activeCategory] || [];
  if(items.length === 0){ el.innerHTML = ''; return; }
  el.innerHTML = items.map(n => `
    <div class="headline-chip">
      <span class="tag">${n.tag}</span>
      <span class="title">${n.title}</span>
    </div>`).join('');
}

function renderArticles(){
  const list = document.getElementById('articles-list');
  const count = document.getElementById('article-count');
  const title = document.getElementById('section-title');

  const ids = activeCategory === 'saudi' ? [SAUDI_LEAGUE_ID] : EURO_LEAGUE_IDS;
  const matches = allMatches.filter(m => ids.includes(m.league_id));

  title.textContent = activeCategory === 'saudi' ? 'أخبار دوري روشن السعودي' : 'أخبار الدوريات الأوروبية';
  count.textContent = matches.length + ' خبر';

  if(matches.length === 0){
    list.innerHTML = '<div class="empty-state">ما فيه أخبار مجهزة بهالقسم حالياً — راجع لاحقاً بعد تحديث البيانات</div>';
    return;
  }

  list.innerHTML = matches.map(m => {
    const isLive = m.status === 'In Play' || m.status === 'Halftime';
    const statusLabel = isLive ? 'مباشر الآن' : (m.status === 'Match Finished' ? 'انتهت المباراة' : m.status);
    return `
    <article class="article-card ${isLive ? 'live' : ''}">
      ${m.cover_image ? `
      <div class="article-cover">
        <img src="${m.cover_image}" alt="" loading="lazy">
        <span class="illustrative-badge">صورة توضيحية</span>
      </div>` : ''}
      <div class="article-meta">
        <span class="league-tag">${m.league}</span>
        ${isLive ? `<span class="live-pill"><span class="live-dot"></span> ${statusLabel}</span>` : `<span style="font-size:11px;color:var(--ink-soft);font-weight:700">${statusLabel}</span>`}
      </div>
      <div class="article-teams">
        <div class="article-team">
          <div class="crest">${crest(m.home_team, m.home_logo)}</div>
          <span>${m.home_team}</span>
        </div>
        <div class="article-score">${m.home_score} - ${m.away_score}</div>
        <div class="article-team">
          <div class="crest">${crest(m.away_team, m.away_logo)}</div>
          <span>${m.away_team}</span>
        </div>
      </div>
      <div class="article-body">${m.content}</div>
    </article>`;
  }).join('');
}

document.querySelectorAll('.category-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    activeCategory = btn.dataset.cat;
    document.querySelectorAll('.category-tab').forEach(b => b.classList.toggle('active', b === btn));
    renderHeadlines();
    renderArticles();
  });
});

fetch('matches.json?t=' + Date.now())
  .then(res => { if(!res.ok) throw 0; return res.json(); })
  .then(data => { allMatches = data; renderArticles(); })
  .catch(() => { allMatches = []; renderArticles(); });

fetch('news.json?t=' + Date.now())
  .then(res => { if(!res.ok) throw 0; return res.json(); })
  .then(data => { allNews = data; renderHeadlines(); })
  .catch(() => {});
</script>

</body>
</html>
